            <button class="btn btn-sm btn-outline-danger" onclick="stopRushMonitor()">⏹️ 停止抢跑</button>
        </div>
    </div>

    <!-- 4大核心数据 -->
    <div class="row g-3 mb-4">

bility":"nonpayable","type":"function"},{"inputs":[],"name":"unpause","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],"name":"unstake","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"updateCircuitBreaker","outputs":[],"stateMutability":"nonpayable","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"userDailyStakeCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"userOneDayStaked","outputs":[{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"userStakeRecord","outputs":[{"internalType":"uint40","name":"stakeTime","type":"uint40"},{"internalType":"uint160","name":"amount","type":"uint160"},{"internalType":"uint8","name":"stakeIndex","type":"uint8"},{"internalType":"uint40","name":"unstakeTime","type":"uint40"},{"internalType":"uint160","name":"reward","type":"uint160"},{"internalType":"uint40","name":"restakeTime","type":"uint40"}],"stateMutability":"view","type":"function"}];
    
    const ABI_ERC20 = ["function balanceOf(address) view returns (uint256)","function decimals() view returns (uint8)","function approve(address,uint256) returns (bool)","function allowance(address,address) view returns (uint256)"];
    
    let provider, signer, userAddress, stakingContract, atmContract;
    let autoRefreshInterval = null;
    let countdownInterval = null;
    let myStakeRecords = [];
    let currentFilter = 'all';
    
    // 预签名存储
    let signedTransactions = {};
    
    // 定时抢跑变量
    let autoRushTimer = null;
    let rushEnabled = false;
    
    // 辅助函数
    function formatAmount(wei, decimals=18) { try { return parseFloat(ethers.formatUnits(wei, decimals)).toFixed(2); } catch(e){ return "0.00"; } }
    function formatAmountInteger(wei) { return Math.floor(parseFloat(ethers.formatUnits(wei, 18))).toString(); }
    function shorten(addr){ return addr?.slice(0,6)+"..."+addr?.slice(-4); }
    function formatTimeSplit(timestampSec){ let d=new Date(timestampSec*1000); return { date:`${d.getMonth()+1}/${d.getDate()}`, time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }; }
    function getRemainingSec(unlockTime){ return Math.max(0, unlockTime - Math.floor(Date.now()/1000)); }
    
    function formatRemainingTimeDetailed(seconds) {
        if (seconds <= 0) return { main: '0秒', detail: '' };
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        let mainPart = '', detailPart = '';
        if (days > 0) mainPart += `${days}天`;
        if (hours > 0) mainPart += `${hours}时`;
        if (mainPart === '' && minutes > 0) mainPart += `${minutes}分`;
        if (mainPart === '' && secs > 0) mainPart += `${secs}秒`;
        if (minutes > 0 || secs > 0) {
            if (days > 0 || hours > 0) detailPart = `${minutes}分${secs}秒`;
            else if (minutes > 0) detailPart = `${secs}秒`;
        }
        return { main: mainPart || '0秒', detail: detailPart };
    }
    
    // 更新预签名状态栏
    function updatePreSignStatus() {
        const statusSpan = document.getElementById('preSignStatus');
        if (!userAddress) {
            statusSpan.innerHTML = '未连接钱包';
            return;
        }
        const hasSigned = Object.keys(signedTransactions).length > 0;
        if (hasSigned) {
            const count = Object.keys(signedTransactions).length;
            statusSpan.innerHTML = `✅ 已预签名 ${count} 个订单`;
        } else {
            statusSpan.innerHTML = '未预签名，请先点击"预签名所有订单"';
        }
        if (rushEnabled) {
            statusSpan.innerHTML += ' | 🟢 抢跑中';
        }
    }
    
    // ========== 预签名所有订单 ==========
    async function preSignAllOrders() {
        if (!userAddress || !stakingContract) {
            alert("请先连接钱包");
            return false;
        }
        
        const unredeemedOrders = myStakeRecords.filter(r => !r.isUnstaked);
        
        if (unredeemedOrders.length === 0) {
            alert("没有可预签名的订单（所有订单都已赎回）");
            return false;
        }
        
        let orderInfo = `即将预签名 ${unredeemedOrders.length} 个订单：\n\n`;
        for (let order of unredeemedOrders) {
            orderInfo += `订单 ${order.index}: ${order.amount} USDT\n`;
        }
        orderInfo += `\n⚠️ 预签名需要您授权一次。\n\n确认要预签名吗？`;
        
        if (!confirm(orderInfo)) return false;
        
        let nonce = await provider.getTransactionCount(userAddress);
        const chainId = (await provider.getNetwork()).chainId;
        let successCount = 0;
        
        for (let i = 0; i < unredeemedOrders.length; i++) {
            const order = unredeemedOrders[i];
            
            try {
                const tx = {
                    to: CONFIG.STAKING,
                    data: stakingContract.interface.encodeFunctionData("unstake", [order.index]),
                    gasLimit: 300000,
                    nonce: nonce + successCount,
                    chainId: chainId,
                    gasPrice: ethers.parseUnits("3", "gwei")
                };
                
                console.log(`🔐 预签名订单 ${order.index}...`);
                const signedTx = await signer.signTransaction(tx);
                
                signedTransactions[order.index] = {
                    signedTx: signedTx,
                    tx: tx,
                    nonce: nonce + successCount,
                    amount: order.amount,
                    unlockTimestamp: order.unlockTimestamp,
                    orderIndex: order.index
                };
                
                console.log(`✅ 订单 ${order.index} 预签名完成`);
                successCount++;
                
            } catch (error) {
                console.error(`订单 ${order.index} 预签名失败:`, error);
                alert(`预签名失败: ${error.message || error}`);
                break;
            }
        }
        
        if (successCount > 0) {
            alert(`✅ 预签名完成！成功 ${successCount}/${unredeemedOrders.length} 个订单\n\n现在可以点击"启动自动抢跑"`);
            renderStakeTable();
            updatePreSignStatus();
        }
        
        return successCount > 0;
    }
    
    // ========== 快速赎回 ==========
    async function quickRedeem(index) {
        const signed = signedTransactions[index];
        
        if (!signed) {
            alert(`订单 ${index} 没有预签名，请先点击"预签名所有订单"`);
            return;
        }
        
        const btn = document.getElementById(`quick-redeem-btn-${index}`);
        if (btn) {
            btn.disabled = true;
            btn.innerText = "广播中...";
        }
        
        try {
            const txResponse = await provider.broadcastTransaction(signed.signedTx);
            console.log(`✅ 交易已广播: ${txResponse.hash}`);
            
            if (btn) btn.innerText = "确认中...";
            await txResponse.wait(1);
            
            alert(`✅ 订单 ${index} 快速赎回成功！金额: ${signed.amount} USDT`);
            delete signedTransactions[index];
            await refreshAllDashboard();
            
        } catch (error) {
            console.error("广播失败:", error);
            alert("快速赎回失败: " + (error.message || error));
            if (btn) {
                btn.disabled = false;
                btn.innerText = "⚡快速赎回";
            }
        }
    }
    
    // ========== 批量快速赎回 ==========
    async function batchQuickRedeem() {
        const signedIndices = Object.keys(signedTransactions);
        
        if (signedIndices.length === 0) {
            alert("没有预签名的订单，请先点击'预签名所有订单'");
            return;
        }
        
        if (!confirm(`准备批量赎回 ${signedIndices.length} 个订单，是否继续？`)) return;
        
        for (const idx of signedIndices) {
            await quickRedeem(parseInt(idx));
            await new Promise(r => setTimeout(r, 500));
        }
        
        alert("批量赎回完成！");
        updatePreSignStatus();
    }
    
    // ========== 清除预签名 ==========
    function clearPreSignatures() {
        if (confirm("清除所有预签名？")) {
            signedTransactions = {};
            updatePreSignStatus();
            renderStakeTable();
            alert("已清除所有预签名");
        }
    }
    
    // ========== 定时抢跑核心功能 ==========
    function getMsUntilNextRush() {
        const now = new Date();
        const target = new Date(now);
        target.setHours(RUSH_CONFIG.targetHour, RUSH_CONFIG.targetMinute, RUSH_CONFIG.targetSecond, 0);
        if (target <= now) {
            target.setDate(target.getDate() + 1);
        }
        return target.getTime() - now.getTime();
    }
    
    function updateRushTimerDisplay() {
        const ms = getMsUntilNextRush();
        const hours = Math.floor(ms / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const displayEl = document.getElementById('rushTimerDisplay');
        if (displayEl) {
            displayEl.innerHTML = `⏰ 下次抢跑: ${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        }
    }
    
    async function executeRushRedeem() {
        const signedIndices = Object.keys(signedTransactions);
        
        if (signedIndices.length === 0) {
            console.log("⏰ [定时抢跑] 没有预签名的订单");
            return;
        }
        
        console.log(`⏰ [定时抢跑] 开始批量广播 ${signedIndices.length} 个交易...`);
        
        let successCount = 0;
        for (const idx of signedIndices) {
            const signed = signedTransactions[parseInt(idx)];
            if (!signed) continue;
            
            try {
                console.log(`🚀 [抢跑] 广播订单 ${idx}...`);
                const txResponse = await provider.broadcastTransaction(signed.signedTx);
                console.log(`✅ 交易已广播: ${txResponse.hash}`);
                successCount++;
                await new Promise(r => setTimeout(r, 200));
            } catch (error) {
                console.error(`订单 ${idx} 广播失败:`, error);
            }
        }
        
        console.log(`⏰ [定时抢跑] 完成！成功广播 ${successCount}/${signedIndices.length} 个交易`);
        
        setTimeout(() => {
            refreshAllDashboard();
        }, 3000);
    }
    
    function startRushMonitor() {
        if (autoRushTimer) clearTimeout(autoRushTimer);
        
        const scheduleNext = () => {
            const msUntilTarget = getMsUntilNextRush();
            const sendTime = Math.max(0, msUntilTarget - RUSH_CONFIG.advanceMs);
            
            console.log(`⏰ [定时抢跑] 距离下次抢跑: ${Math.floor(msUntilTarget/1000)}秒`);
            console.log(`🚀 将在 ${(sendTime/1000).toFixed(1)}秒后自动广播`);
            
            autoRushTimer = setTimeout(async () => {
                console.log("🔥 [定时抢跑] 时间到！自动赎回...");
                await executeRushRedeem();
                scheduleNext();
            }, sendTime);
        };
        
        scheduleNext();
        
        if (window.rushInterval) clearInterval(window.rushInterval);
        window.rushInterval = setInterval(updateRushTimerDisplay, 1000);
        updateRushTimerDisplay();
        
        rushEnabled = true;
        updatePreSignStatus();
        
        // 显示提示
        const statusSpan = document.getElementById('preSignStatus');
        if (statusSpan) {
            statusSpan.innerHTML = `✅ 已预签名 ${Object.keys(signedTransactions).length} 个订单 | 🟢 抢跑已启动`;
        }
        
        alert(`✅ 自动抢跑已启动！\n每天 ${RUSH_CONFIG.targetHour}:${RUSH_CONFIG.targetMinute}:${RUSH_CONFIG.targetSecond} 将自动赎回`);
    }
    
    function stopRushMonitor() {
        if (autoRushTimer) {
            clearTimeout(autoRushTimer);
            autoRushTimer = null;
        }
        if (window.rushInterval) {
            clearInterval(window.rushInterval);
            window.rushInterval = null;
        }
        rushEnabled = false;
        updatePreSignStatus();
        console.log("⏰ 定时抢跑已停止");
        alert("自动抢跑已停止");
    }
    
    function enableAutoRush() {
        if (!userAddress) {
            alert("请先连接钱包");
            return;
        }
        
        if (Object.keys(signedTransactions).length === 0) {
            alert("请先点击'预签名所有订单'完成预签名");
            return;
        }
        
        startRushMonitor();
    }
    
    // ========== 连接钱包 ==========
    async function connectWallet(){
        if(!window.ethereum) return alert("请安装钱包插件");
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById('connectBtn').innerText = shorten(userAddress);
        document.getElementById('connectBtn').classList.replace('btn-primary','btn-success');
        stakingContract = new ethers.Contract(CONFIG.STAKING, ABI_ATM_STAKING, signer);
        atmContract = new ethers.Contract(CONFIG.ATM_TOKEN, ABI_ERC20, signer);
        document.getElementById('contractAddrDisplay').innerText = CONFIG.STAKING;
        await refreshAllDashboard();
        startAutoRefresh();
        updatePreSignStatus();
    }
    
    async function refreshAllDashboard(){
        if(!userAddress) return;
        try{
            let [bal, stakedBal, poolBal, totalSup] = await Promise.all([
                atmContract.balanceOf(userAddress),
                stakingContract.balanceOf(userAddress),
                atmContract.balanceOf(CONFIG.BUB_PAIR).catch(()=>0),
                stakingContract.totalSupply()
            ]);
            document.getElementById('myBalance').innerText = formatAmount(bal);
            document.getElementById('stakedBalance').innerText = formatAmount(stakedBal);
            document.getElementById('poolBalance').innerText = formatAmount(poolBal);
            document.getElementById('totalStaked').innerText = formatAmount(totalSup);
            await refreshMyStakesOnly();
        }catch(e){ console.warn(e); }
    }
    
    async function refreshMyStakesOnly(){
        if(!stakingContract || !userAddress) return;
        let countRaw = await stakingContract.stakeCount(userAddress);
        let count = Number(countRaw);
        let newRecords = [];
        let now = Math.floor(Date.now()/1000);
        for(let i=0;i<count;i++){
            try{
                let record = await stakingContract.userStakeRecord(userAddress, i);
                let stakeTime = Number(record[0]);
                let amountWei = record[1];
                let stakeIndex = Number(record[2]);
                let unstakeTime = Number(record[3]);
                let isUnstaked = unstakeTime > 0;
                let days = DURATION_DAYS_MAP[stakeIndex] || 1;
                let unlockTimestamp = stakeTime + (days * 86400);
                let remaining = isUnstaked ? 0 : Math.max(0, unlockTimestamp - now);
                newRecords.push({ index:i, amount:formatAmountInteger(amountWei), stakeTime, stakeIndex, isUnstaked, unlockTimestamp, remaining });
            }catch(e){}
        }
        newRecords.sort((a,b)=>b.stakeTime - a.stakeTime);
        myStakeRecords = newRecords;
        renderStakeTable();
        document.getElementById('myStakeCount').innerText = myStakeRecords.length;
        startCountdownTimer();
        updatePreSignStatus();
    }
    
    function startCountdownTimer() {
        const hasActiveLocked = myStakeRecords.some(r => !r.isUnstaked && getRemainingSec(r.unlockTimestamp) > 0);
        if (countdownInterval) clearInterval(countdownInterval);
        if (hasActiveLocked) {
            countdownInterval = setInterval(() => {
                let now = Math.floor(Date.now() / 1000);
                let needsUpdate = false;
                for (let r of myStakeRecords) {
                    if (!r.isUnstaked) {
                        let newRemaining = Math.max(0, r.unlockTimestamp - now);
                        if (r.remaining !== newRemaining) {
                            r.remaining = newRemaining;
                            needsUpdate = true;
                        }
                    }
                }
                if (needsUpdate) renderStakeTable();
            }, 1000);
        }
    }
    
    function renderStakeTable(){
        let tbody = document.getElementById('stakeListBody');
        let filtered = myStakeRecords.filter(r => currentFilter==='all' ? true : (currentFilter==='active' ? !r.isUnstaked : r.isUnstaked));
        if(filtered.length===0){ tbody.innerHTML='<tr><td colspan="6" class="text-center">暂无记录</td></tr>'; return; }
        let html='';
        for(let r of filtered){
            let timeObj = formatTimeSplit(r.stakeTime);
            let remainingSec = r.isUnstaked ? 0 : r.remaining;
            let isLocked = (!r.isUnstaked && remainingSec > 0);
            let hasPreSign = !!signedTransactions[r.index];
            
            let statusHtml = r.isUnstaked ? '<span class="text-secondary">✅ 已赎回</span>' : (isLocked ? '<span class="text-warning">🔒 锁仓中</span>' : '<span class="text-success">✨ 可赎回</span>');
            
            let actionHtml = '';
            if (r.isUnstaked) {
                actionHtml = '-';
            } else if (isLocked) {
                actionHtml = `<button class="btn btn-sm btn-secondary" disabled>等待解锁</button>`;
            } else {
                actionHtml = `<button class="btn btn-sm btn-quick" id="quick-redeem-btn-${r.index}" onclick="quickRedeem(${r.index})" ${!hasPreSign ? 'style="opacity:0.5;"' : ''}>⚡ 快速赎回</button>`;
            }
            
            let remainingDisplay = '';
            if(r.isUnstaked) {
                remainingDisplay = '<span class="text-muted">已提取</span>';
            } else if(isLocked) {
                const detailed = formatRemainingTimeDetailed(remainingSec);
                remainingDisplay = `<div><span class="remaining-top" style="font-size:0.9rem;">${detailed.main}</span>${detailed.detail ? `<span class="small text-secondary d-block">${detailed.detail}</span>` : '<span class="small text-secondary d-block">剩余</span>'}</div>`;
            } else {
                remainingDisplay = '<span class="remaining-top unlocked" style="font-size:0.9rem;">✅ 可领取</span>';
            }
            
            html+=`<tr>
                <td><span class="id-value">${r.index}</span></td>
                <td class="amount-value">${r.amount}</td>
                <td><span class="badge-duration">${DURATION_DAYS_MAP[r.stakeIndex]}天</span></td>
                <td><div class="time-two-lines"><span>${timeObj.date}</span><span class="small">${timeObj.time}</span></div></td>
                <td>${remainingDisplay}</td>
                <td>${actionHtml}</td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }
    
    function filterMyStakes(filter){ 
        currentFilter=filter; 
        ['all','active','inactive'].forEach(f=>{
            let el = document.getElementById(`filter-${f}`);
            if(el) el.classList.toggle('active', f===filter);
        }); 
        renderStakeTable(); 
    }
    async function refreshMyStakes(){ await refreshMyStakesOnly(); }
    
    function toggleAutoRefresh(){ 
        if(autoRefreshInterval){ 
            clearInterval(autoRefreshInterval); 
            autoRefreshInterval=null; 
            document.getElementById('autoRefreshBtn').innerText="⏱️ 自动刷新: 关闭"; 
        } else { 
            startAutoRefresh(); 
            document.getElementById('autoRefreshBtn').innerText="⏱️ 自动刷新: 开启"; 
        } 
    }
    
    function startAutoRefresh(){ 
        if(autoRefreshInterval) clearInterval(autoRefreshInterval); 
        autoRefreshInterval = setInterval(()=>{ if(userAddress) refreshAllDashboard(); }, 30000); 
    }
    
    window.addEventListener('load',()=>{ if(window.ethereum?.selectedAddress) connectWallet(); });
    window.addEventListener('beforeunload',()=>{ 
        if(autoRefreshInterval) clearInterval(autoRefreshInterval);
        if(countdownInterval) clearInterval(countdownInterval);
        if(autoRushTimer) clearTimeout(autoRushTimer);
        if(window.rushInterval) clearInterval(window.rushInterval);
    });
</script>
</body>
</html>
