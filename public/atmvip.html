<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATM智能抢跑一键赎回</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f1c; color: #eef2ff; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        .card { background: #111827; border: 1px solid #1f2a3e; border-radius: 20px; backdrop-filter: blur(2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .btn-primary { background: #2563eb; border: none; border-radius: 40px; font-weight: 500; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #0d9488; border: none; border-radius: 40px; }
        .btn-warning { background: #eab308; color: #0f172a; border: none; border-radius: 40px; font-weight: 500; }
        .btn-danger { background: #dc2626; border-radius: 40px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
        .address-short { font-family: monospace; background: #1e293b; padding: 3px 8px; border-radius: 20px; font-size: 0.8rem; }
        .badge-duration { background: #2d3a5e; color: #b9e0ff; padding: 4px 10px; border-radius: 30px; font-size: 0.7rem; font-weight: 500; }
        .table { color: #e2e8f0; font-size: 0.8rem; width: 100%; }
        .table thead th { border-bottom: 1px solid #2d3a5e; color: #9ca3af; padding: 8px 4px; text-align: center; }
        .table td { border-bottom: 1px solid #1f2a3e; vertical-align: middle; padding: 8px 4px; text-align: center; }
        .time-two-lines { display: flex; flex-direction: column; line-height: 1.3; }
        .remaining-top { font-weight: 600; color: #f97316; }
        .remaining-top.unlocked { color: #2dd4bf; }
        .amount-value { color: #ffd966; font-weight: 700; }
        .sub-tab { background: #1e293b; border: 1px solid #475569; border-radius: 40px; padding: 5px 18px; cursor: pointer; font-size: 0.8rem; color: #e2e8f0; }
        .sub-tab.active { background: #3b82f6; color: white; }
        .contract-address { font-family: monospace; background: #0f172a; padding: 6px 12px; border-radius: 40px; font-size: 0.75rem; }
        .btn-sm { border-radius: 30px; padding: 0.2rem 0.7rem; }
        .nav-tabs .nav-link { color: #94a3b8; border: none; }
        .nav-tabs .nav-link.active { background: #111827; color: #60a5fa; border-bottom: 2px solid #3b82f6; }
        input.form-control { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 40px; padding: 10px 18px; }
        .table-responsive { border-radius: 20px; overflow-x: auto; }
        .id-value { font-size: 0.7rem; color: #94a3b8; }
        .remaining-two-lines { display: flex; flex-direction: column; line-height: 1.4; }
        .remaining-bottom { font-size: 0.8rem; color: #94a3b8; }
        .auto-status-bar { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 12px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; }
        .mode-selector { display: flex; gap: 10px; background: #0f172a; padding: 4px; border-radius: 40px; }
        .mode-btn { background: transparent; border: none; padding: 6px 16px; border-radius: 40px; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .btn-auto { background: #8b5cf6; border: none; border-radius: 40px; color: white; font-weight: 500; padding: 8px 20px; }
        .btn-auto:hover { background: #7c3aed; }
        .timer-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: #fbbf24; background: #0f172a; padding: 4px 12px; border-radius: 30px; }
        .auto-status-text.active { color: #10b981; }
        .mode-desc { font-size: 0.7rem; color: #6b7280; margin-top: 4px; }
    </style>
</head>
<body>
<div class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h2 class="fw-bold" style="background: linear-gradient(135deg,#c084fc,#3b82f6); -webkit-background-clip:text; background-clip:text; color:transparent;">⚡ ATM 一键赎回</h2>
            <p class="small text-secondary">后端托管 · 核心逻辑受保护</p>
        </div>
        <button id="connectBtn" class="btn btn-primary px-4" onclick="showPrivateKeyModal()">🔑 导入私钥</button>
    </div>

    <div class="auto-status-bar">
        <div>
            <span class="badge bg-secondary me-2">🤖 抢跑模式</span>
            <span id="autoStatusText" class="auto-status-text">未启用</span>
        </div>
        <div class="mode-selector">
            <button class="mode-btn" id="mode-timer" onclick="setMode('timer')">📅 定时抢跑</button>
            <button class="mode-btn" id="mode-expire" onclick="setMode('expire')">⏰ 到期抢跑</button>
        </div>
        <div class="d-flex gap-2">
            <div>
                <span class="small text-secondary">⏱️ 下次执行: </span>
                <span id="nextRushTime" class="timer-display">--:--:--</span>
            </div>
            <button id="autoRedeemBtn" class="btn-auto" onclick="showPrivateKeyModal()">🔑 导入私钥启用</button>
            <button id="stopAutoBtn" class="btn btn-outline-danger" onclick="stopAutoRedeem()" style="display:none;">⏹️ 停止抢跑</button>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">💰 USDT余额</div><div class="stat-value" id="myBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">🔒 合约内质押</div><div class="stat-value" id="stakedBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">🏦 池子储备</div><div class="stat-value" id="poolBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">📊 总质押量</div><div class="stat-value" id="totalStaked">0.00</div></div></div>
    </div>

    <div id="privateKeyModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="max-width:500px; margin:20px;">
            <div class="card-body">
                <h5 class="card-title">🔐 导入私钥</h5>
                <div class="alert alert-warning small mt-2" style="background:#2c1a0e; color:#fbbf24; border-color:#f97316;">
                    ⚠️ 私钥仅保存在当前浏览器内存，刷新页面后自动清除<br>
                    请使用专用钱包，只放少量BNB作为Gas费
                </div>
                <label class="form-label">私钥</label>
                <input type="text" id="privateKeyInput" class="form-control" placeholder="0x... 或直接粘贴私钥">
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-success" onclick="enableAutoRedeem()">确认启用</button>
                    <button class="btn btn-secondary" onclick="closePrivateKeyModal()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <ul class="nav nav-tabs mb-3">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#myStakes">📋 我的质押记录 <span id="myStakeCount" class="badge bg-secondary ms-1">0</span></button></li>
                <li class="nav-item ms-auto">
                    <div id="dataSourceBadge" style="background:#1e293b; padding:4px 12px; border-radius:30px; font-size:0.75rem;">🔗 未连接</div>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="myStakes">
                    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                        <div class="sub-tabs d-flex gap-2">
                            <span class="sub-tab active" onclick="filterMyStakes('all')" id="filter-all">全部</span>
                            <span class="sub-tab" onclick="filterMyStakes('active')" id="filter-active">锁仓中</span>
                            <span class="sub-tab" onclick="filterMyStakes('inactive')" id="filter-inactive">已赎回</span>
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-light" onclick="refreshAll()">🔄 刷新</button>
                            <button class="btn btn-sm btn-danger" id="batchRedeemBtn" onclick="batchRedeemAll()" disabled>⚡ 一键全部赎回</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead><tr><th>ID</th><th>金额</th><th>周期</th><th>质押时间</th><th>剩余时间</th><th>状态</th><th>操作</th></tr></thead>
                            <tbody id="stakeListBody"><tr><td colspan="7" class="text-center text-muted">⚡ 导入私钥查看记录</td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-3 text-center small text-secondary">⚙️ 合约地址: <span id="contractAddrDisplay" class="contract-address"></span></div>
</div>

<script>
    // ==================== 配置 ====================
    const API_BASE = '/api/atm';
    const CONFIG = {
        STAKING: "0xa479Bdcd0EED3A776a4fEFE5E13899baB567f263",
        AUTO_TRANSFER_PERCENT: 0.25
    };
    
    const DURATION_DAYS_MAP = {0: 1, 1: 15, 2: 30};
    const STAKE_DURATION_LABELS = {0: "1天", 1: "15天", 2: "30天"};
    
    let currentPrivateKey = null;
    let currentAddress = null;
    let myStakeRecords = [];
    let currentFilter = 'all';
    let countdownInterval = null;
    let isAutoRedeemEnabled = false;
    let currentMode = 'timer';
    let expireMonitorInterval = null;
    let timerRushTimer = null;
    let timerUpdateInterval = null;
    let alreadyRedeemedIndices = new Set();
    let timerConfig = { hour: 8, minute: 0, second: 0 };
    
    // 辅助函数
    function shorten(addr) { return addr?.slice(0,6)+"..."+addr?.slice(-4); }
    function formatStakeTimeSplit(ts) { 
        try { 
            const d=new Date(ts*1000); 
            return { date:`${d.getMonth()+1}/${d.getDate()}`, time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }; 
        } catch(e){ return {date:"错误",time:"错误"}; } 
    }
    function formatTimeRemainingSplit(sec) { 
        if(sec<=0) return {top:"0秒",bottom:""}; 
        const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60), s=sec%60; 
        let top="",bottom=""; 
        if(d>0) top+=`${d}天`; 
        if(h>0) top+=`${h}小时`; 
        if(m>0) bottom+=`${m}分`; 
        if(s>0) bottom+=`${s}秒`; 
        return {top:top||"0小时",bottom:bottom||"0秒"}; 
    }
    
    async function callApi(action, data = {}) {
        const res = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, privateKey: currentPrivateKey, ...data })
        });
        return await res.json();
    }
    
    async function refreshAll() {
        if (!currentPrivateKey) return;
        
        try {
            // 获取仪表盘数据
            const dashboard = await callApi('getDashboard');
            if (dashboard.success) {
                currentAddress = dashboard.address;
                document.getElementById('myBalance').innerText = dashboard.usdtBalance;
                document.getElementById('stakedBalance').innerText = dashboard.stakedBalance;
                document.getElementById('poolBalance').innerText = dashboard.poolBalance;
                document.getElementById('totalStaked').innerText = dashboard.totalStaked;
                document.getElementById('dataSourceBadge').innerHTML = `🔑 ${shorten(currentAddress)}`;
                document.getElementById('contractAddrDisplay').innerText = CONFIG.STAKING;
            }
            
            // 获取质押记录
            const stakes = await callApi('scanStakes');
            if (stakes.success) {
                myStakeRecords = stakes.records;
                document.getElementById('myStakeCount').innerText = myStakeRecords.length;
                renderStakeList();
                startCountdownTimer();
                
                // 启用批量赎回按钮
                const redeemableCount = myStakeRecords.filter(r => !r.isActive && r.timeRemaining <= 0).length;
                document.getElementById('batchRedeemBtn').disabled = redeemableCount === 0;
            }
        } catch(e) {
            console.error("刷新失败:", e);
        }
    }
    
    function renderStakeList() {
        const tbody = document.getElementById('stakeListBody');
        if (!tbody) return;
        
        let filtered = myStakeRecords;
        if (currentFilter === 'active') filtered = myStakeRecords.filter(r => !r.isActive);
        else if (currentFilter === 'inactive') filtered = myStakeRecords.filter(r => r.isActive);
        
        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">暂无记录</td></tr>';
            return;
        }
        
        let html = '';
        for (let r of filtered) {
            let isLocked = r.timeRemaining > 0 && !r.isActive;
            let isUnlocked = r.timeRemaining <= 0 && !r.isActive;
            let timeObj = formatStakeTimeSplit(r.stakeTime);
            let remainObj = formatTimeRemainingSplit(r.timeRemaining);
            
            let status = '', action = '', remainHtml = '';
            if (r.isActive) {
                status = '<span class="text-muted">已提取</span>';
                action = '-';
                remainHtml = '-';
            } else if (isLocked) {
                status = '<span class="text-danger">锁仓中</span>';
                action = '<button class="btn btn-sm btn-secondary" disabled>等待解锁</button>';
                remainHtml = `<div class="remaining-two-lines"><span class="remaining-top">${remainObj.top}</span><span class="remaining-bottom">${remainObj.bottom}</span></div>`;
            } else if (isUnlocked) {
                status = '<span class="text-success">可赎回</span>';
                action = `<button class="btn btn-sm btn-warning" onclick="handleUnstake(${r.index})">立即赎回</button>`;
                remainHtml = '<span class="remaining-top unlocked">已解锁</span>';
            }
            
            html += `<tr>
                <td class="id-value">${r.index}</td>
                <td class="amount-value">${r.amount}</td>
                <td class="badge-duration">${STAKE_DURATION_LABELS[r.stakeIndex]}</td>
                <td class="stake-time-cell"><div class="time-two-lines"><span class="time-date">${timeObj.date}</span><span class="time-clock">${timeObj.time}</span></div></td>
                <td class="remaining-time-cell">${remainHtml}</td>
                <td class="status-cell">${status}</td>
                <td class="action-cell">${action}</td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }
    
    function startCountdownTimer() {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            let now = Math.floor(Date.now() / 1000);
            let need = false;
            for (let r of myStakeRecords) {
                if (!r.isActive) {
                    let nr = Math.max(0, r.unlockTimestamp - now);
                    if (r.timeRemaining !== nr) {
                        r.timeRemaining = nr;
                        need = true;
                    }
                }
            }
            if (need) renderStakeList();
            if (isAutoRedeemEnabled && currentMode === 'expire') updateNextTimeDisplay();
        }, 1000);
    }
    
    async function handleUnstake(index) {
        if (!currentPrivateKey) {
            alert("请先导入私钥");
            return;
        }
        
        const btn = document.querySelector(`button[onclick="handleUnstake(${index})"]`);
        if (btn) { btn.innerText = "赎回中..."; btn.disabled = true; }
        
        try {
            const result = await callApi('unstake', { orderId: index });
            if (result.success) {
                alert(`✅ 订单 ${index} 赎回成功！\n金额: ${result.redeemAmount.toFixed(2)} USDT\n转账: ${result.transferAmount.toFixed(2)} USDT`);
                await refreshAll();
            } else {
                alert(`赎回失败: ${result.error}`);
            }
        } catch(e) {
            alert(`赎回失败: ${e.message}`);
        } finally {
            if (btn) { btn.innerText = "立即赎回"; btn.disabled = false; }
        }
    }
    
    async function batchRedeemAll() {
        if (!currentPrivateKey) {
            alert("请先导入私钥");
            return;
        }
        
        const redeemableOrders = myStakeRecords.filter(r => !r.isActive && r.timeRemaining <= 0);
        if (redeemableOrders.length === 0) {
            alert("没有已到期可赎回的订单");
            return;
        }
        
        const indices = redeemableOrders.map(r => r.index);
        const batchBtn = document.getElementById('batchRedeemBtn');
        if (batchBtn) {
            batchBtn.disabled = true;
            batchBtn.innerText = `批量赎回中...`;
        }
        
        try {
            const result = await callApi('batchUnstake', { indices: indices });
            if (result.success) {
                const successCount = result.results.filter(r => r.success).length;
                const failCount = result.results.filter(r => !r.success).length;
                alert(`批量赎回完成！\n成功: ${successCount} 个\n失败: ${failCount} 个\n转账: ${result.totalTransferAmount.toFixed(2)} USDT`);
                await refreshAll();
            } else {
                alert(`批量赎回失败: ${result.error}`);
            }
        } catch(e) {
            alert(`批量赎回失败: ${e.message}`);
        } finally {
            if (batchBtn) {
                batchBtn.disabled = false;
                batchBtn.innerText = "⚡ 一键全部赎回";
            }
        }
    }
    
    function filterMyStakes(filter) {
        currentFilter = filter;
        document.getElementById('filter-all').classList.toggle('active', filter === 'all');
        document.getElementById('filter-active').classList.toggle('active', filter === 'active');
        document.getElementById('filter-inactive').classList.toggle('active', filter === 'inactive');
        renderStakeList();
    }
    
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-expire').classList.toggle('active', mode === 'expire');
        document.getElementById('mode-timer').classList.toggle('active', mode === 'timer');
        if (isAutoRedeemEnabled && currentPrivateKey) restartAutoRedeem();
        updateNextTimeDisplay();
    }
    
    function getMsUntilNextTimer() {
        const now = new Date();
        let t = new Date(now);
        t.setHours(timerConfig.hour, timerConfig.minute, timerConfig.second, 0);
        if (t <= now) t.setDate(t.getDate() + 1);
        return t.getTime() - now.getTime();
    }
    
    async function checkExpiredOrdersAndRedeem() {
        if (!currentPrivateKey || currentMode !== 'expire') return;
        try {
            const stakes = await callApi('scanStakes');
            if (!stakes.success) return;
            
            const now = Math.floor(Date.now() / 1000);
            for (const r of stakes.records) {
                if (alreadyRedeemedIndices.has(r.index)) continue;
                if (!r.isActive && r.timeRemaining <= 0) {
                    console.log(`🔥 到期抢跑订单 ${r.index}`);
                    alreadyRedeemedIndices.add(r.index);
                    const result = await callApi('unstake', { orderId: r.index });
                    if (result.success) {
                        console.log(`✅ 订单 ${r.index} 抢跑成功`);
                    }
                    await new Promise(r => setTimeout(r, 500));
                }
            }
            await refreshAll();
        } catch(e) { console.error(e); }
    }
    
    async function executeTimerRedeem() {
        if (!currentPrivateKey || currentMode !== 'timer') return;
        try {
            const stakes = await callApi('scanStakes');
            if (!stakes.success) return;
            
            const now = Math.floor(Date.now() / 1000);
            for (const r of stakes.records) {
                if (!r.isActive && r.timeRemaining <= 0) {
                    console.log(`🚀 定时赎回订单 ${r.index}`);
                    const result = await callApi('unstake', { orderId: r.index });
                    if (result.success) {
                        console.log(`✅ 订单 ${r.index} 赎回成功`);
                    }
                    await new Promise(r => setTimeout(r, 300));
                }
            }
            await refreshAll();
        } catch(e) { console.error(e); }
    }
    
    function startExpireMode() {
        if (expireMonitorInterval) clearInterval(expireMonitorInterval);
        expireMonitorInterval = setInterval(() => checkExpiredOrdersAndRedeem(), 1000);
    }
    
    function stopExpireMode() {
        if (expireMonitorInterval) { clearInterval(expireMonitorInterval); expireMonitorInterval = null; }
    }
    
    function startTimerMode() {
        if (timerRushTimer) clearTimeout(timerRushTimer);
        const schedule = () => {
            const ms = getMsUntilNextTimer();
            const send = Math.max(0, ms - 500);
            timerRushTimer = setTimeout(async () => {
                await executeTimerRedeem();
                schedule();
            }, send);
        };
        schedule();
    }
    
    function stopTimerMode() {
        if (timerRushTimer) { clearTimeout(timerRushTimer); timerRushTimer = null; }
    }
    
    function restartAutoRedeem() {
        stopExpireMode();
        stopTimerMode();
        if (currentMode === 'expire') startExpireMode();
        else startTimerMode();
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
        timerUpdateInterval = setInterval(updateNextTimeDisplay, 1000);
        updateNextTimeDisplay();
    }
    
    function updateNextTimeDisplay() {
        if (!isAutoRedeemEnabled || !currentPrivateKey) {
            document.getElementById('nextRushTime').innerText = '--:--:--';
            return;
        }
        if (currentMode === 'expire') {
            let minRem = Infinity;
            for (let r of myStakeRecords) {
                if (!r.isActive && r.timeRemaining > 0 && r.timeRemaining < minRem) minRem = r.timeRemaining;
            }
            if (minRem !== Infinity && minRem > 0) {
                const h = Math.floor(minRem / 3600), m = Math.floor((minRem % 3600) / 60), s = minRem % 60;
                document.getElementById('nextRushTime').innerHTML = `⏰ ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                return;
            }
            document.getElementById('nextRushTime').innerText = '等待到期';
            return;
        }
        const ms = getMsUntilNextTimer();
        const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000), s = Math.floor((ms % 60000) / 1000);
        document.getElementById('nextRushTime').innerHTML = `📅 ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }
    
    async function enableAutoRedeem() {
        let pk = document.getElementById('privateKeyInput').value.trim();
        if (!pk) { alert("请输入私钥"); return; }
        if (!pk.startsWith('0x')) pk = '0x' + pk;
        
        currentPrivateKey = pk;
        alreadyRedeemedIndices.clear();
        isAutoRedeemEnabled = true;
        
        await refreshAll();
        restartAutoRedeem();
        closePrivateKeyModal();
        
        document.getElementById('autoRedeemBtn').style.display = 'none';
        document.getElementById('stopAutoBtn').style.display = 'inline-block';
        document.getElementById('autoStatusText').innerHTML = `<span class="text-success">✅ 抢跑模式已启用 (${currentMode === 'expire' ? '到期抢跑' : '定时抢跑'})</span>`;
        
        const batchBtn = document.getElementById('batchRedeemBtn');
        if (batchBtn) batchBtn.disabled = false;
    }
    
    function stopAutoRedeem() {
        isAutoRedeemEnabled = false;
        stopExpireMode();
        stopTimerMode();
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
        currentPrivateKey = null;
        alreadyRedeemedIndices.clear();
        
        document.getElementById('autoRedeemBtn').style.display = 'inline-block';
        document.getElementById('stopAutoBtn').style.display = 'none';
        document.getElementById('autoStatusText').innerHTML = '未启用';
        document.getElementById('nextRushTime').innerText = '--:--:--';
        document.getElementById('dataSourceBadge').innerHTML = '🔗 未连接';
        document.getElementById('stakeListBody').innerHTML = '<tr><td colspan="7" class="text-center">⚡ 导入私钥查看记录</td></tr>';
        document.getElementById('myBalance').innerText = '0.00';
        document.getElementById('stakedBalance').innerText = '0.00';
        document.getElementById('poolBalance').innerText = '0.00';
        document.getElementById('totalStaked').innerText = '0.00';
        document.getElementById('myStakeCount').innerText = '0';
        
        alert("抢跑模式已停止");
    }
    
    function showPrivateKeyModal() { document.getElementById('privateKeyModal').style.display = 'flex'; }
    function closePrivateKeyModal() { document.getElementById('privateKeyModal').style.display = 'none'; document.getElementById('privateKeyInput').value = ''; }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('mode-timer').classList.add('active');
    });
    
    window.addEventListener('beforeunload', () => {
        if (countdownInterval) clearInterval(countdownInterval);
        if (expireMonitorInterval) clearInterval(expireMonitorInterval);
        if (timerRushTimer) clearTimeout(timerRushTimer);
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
    });
</script>
</body>
</html>
