<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATM 多钱包自动抢跑系统 - 本地版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f1c; color: #eef2ff; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; padding: 16px; }
        .card { background: #111827; border: 1px solid #1f2a3e; border-radius: 20px; margin-bottom: 20px; }
        .card-header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 20px; font-weight: 600; border-radius: 20px 20px 0 0; color: #fbbf24; }
        .card-body { padding: 16px; }
        /* 新增：表单标签颜色（抢跑模式、执行时间） */
        .form-label { color: #fbbf24; font-weight: 500; margin-bottom: 6px; }
        .btn-primary { background: #2563eb; border: none; border-radius: 40px; }
        .btn-danger { background: #dc2626; border: none; border-radius: 40px; }
        .btn-success { background: #10b981; border: none; border-radius: 40px; }
        .btn-warning { background: #eab308; color: #0f172a; border: none; border-radius: 40px; }
        .private-key-input { font-family: monospace; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; width: 100%; padding: 12px; border-radius: 12px; font-size: 0.8rem; }
        .wallet-card { background: #1e293b; border-radius: 16px; padding: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        .wallet-address { font-family: monospace; color: #60a5fa; font-size: 0.75rem; }
        .balance { color: #4ade80; font-weight: 600; }
        .record-item { font-size: 0.7rem; padding: 4px 8px; background: #0f172a; border-radius: 8px; margin: 2px; display: inline-block; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #fbbf24; }
        .progress-bar-custom { height: 4px; background: #2d3a5e; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #3b82f6); transition: width 0.3s; }
        .scrollable { max-height: 400px; overflow-y: auto; }
        .text-gradient { background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .mode-selector { display: flex; gap: 10px; background: #0f172a; padding: 4px; border-radius: 40px; display: inline-flex; }
        .mode-btn { background: transparent; border: none; padding: 6px 16px; border-radius: 40px; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .timer-display { font-family: monospace; font-size: 1rem; font-weight: bold; color: #fbbf24; background: #0f172a; padding: 4px 12px; border-radius: 30px; }
    </style>
</head>
<body>
<div class="container-fluid" style="max-width: 1400px;">
    <!-- 头部 -->
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="fw-bold"><span class="text-gradient">⚡ ATM 多钱包自动抢跑系统</span></h2>
            <p class="small text-secondary">本地版 · 定时抢跑 · 到期抢跑</p>
        </div>
        <div>
            <span class="badge bg-secondary me-2">☁️ 本地版</span>
            <span id="systemStatus" class="badge bg-success">● 待机</span>
        </div>
    </div>
    
    <!-- 统计卡片 -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card text-center p-2">
                <div class="stat-label small text-secondary">📊 钱包总数</div>
                <div class="stat-value" id="totalWallets">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center p-2">
                <div class="stat-label small text-secondary">💰 总USDT余额</div>
                <div class="stat-value" id="totalUSDT">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center p-2">
                <div class="stat-label small text-secondary">🔓 待赎回订单</div>
                <div class="stat-value" id="totalRedeemable">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center p-2">
                <div class="stat-label small text-secondary">✅ 已赎回金额</div>
                <div class="stat-value" id="totalRedeemedAmount">0</div>
            </div>
        </div>
    </div>
    
    <!-- 抢跑模式配置 -->
    <div class="card">
        <div class="card-header">⚙️ 抢跑模式配置</div>
        <div class="card-body">
            <div class="row g-3 align-items-center">
                <div class="col-md-auto">
                    <label class="form-label small">抢跑模式</label>
                    <div class="mode-selector">
                        <button class="mode-btn" id="mode-timer" onclick="setMode('timer')">📅 定时抢跑</button>
                        <button class="mode-btn" id="mode-expire" onclick="setMode('expire')">⏰ 到期抢跑</button>
                    </div>
                </div>
                <div class="col-md-auto" id="timerConfigPanel">
                    <label class="form-label small">执行时间 (24小时制)</label>
                    <div class="d-flex gap-2">
                        <select id="timerHour" class="form-select form-select-sm" style="width: 80px; background:#1e293b; border-color:#334155; color:white;">
                            <script>for(let i=0;i<24;i++) document.write(`<option value="${i}" ${i===8 ? 'selected' : ''}>${i.toString().padStart(2,'0')}</option>`);</script>
                        </select>
                        <span>:</span>
                        <select id="timerMinute" class="form-select form-select-sm" style="width: 80px; background:#1e293b; border-color:#334155; color:white;">
                            <script>for(let i=0;i<60;i++) document.write(`<option value="${i}" ${i===0 ? 'selected' : ''}>${i.toString().padStart(2,'0')}</option>`);</script>
                        </select>
                        <button class="btn btn-sm btn-primary" onclick="updateTimerConfig()">设置</button>
                    </div>
                </div>
                <div class="col-md-auto">
                    <div class="small text-secondary">⏱️ 下次执行: <span id="nextRushTime" class="timer-display">--:--:--</span></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 私钥导入区域 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>🔑 批量导入私钥</span>
            <div>
                <button class="btn btn-sm btn-outline-light" onclick="showExample()">📋 示例格式</button>
                <button class="btn btn-sm btn-outline-light" onclick="clearAllWallets()">🗑️ 清空所有</button>
                <button class="btn btn-sm btn-outline-light" onclick="exportWallets()">💾 导出钱包</button>
                <button class="btn btn-sm btn-outline-light" onclick="importWalletsFromFile()">📂 导入备份</button>
            </div>
        </div>
        <div class="card-body">
            <textarea id="privateKeysInput" class="private-key-input" rows="4" placeholder="每行一个私钥（支持0x开头或不带0x）&#10;0x1234567890abcdef..."></textarea>
            <div class="d-flex gap-2 mt-3 flex-wrap">
                <button class="btn btn-primary" onclick="importPrivateKeys()">📥 导入私钥</button>
                <button class="btn btn-success" onclick="startAutoMonitor()" id="startMonitorBtn">▶️ 启动抢跑</button>
                <button class="btn btn-warning" onclick="stopAutoMonitor()" id="stopMonitorBtn" style="display:none;">⏸️ 停止抢跑</button>
                <button class="btn btn-danger" onclick="batchRedeemAllNow()">⚡ 立即全部赎回</button>
                <button class="btn btn-info" onclick="refreshAllWallets()">🔄 刷新所有数据</button>
            </div>
            <div class="mt-2 text-secondary small">
                ⚠️ 私钥仅保存在当前浏览器内存，刷新页面后清除 | 请确保每个钱包有至少 0.01 BNB 作为 Gas 费
            </div>
        </div>
    </div>
    
    <!-- 钱包列表 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span>📋 钱包列表 (<span id="walletCount">0</span>)</span>
            <div>
                <input type="text" id="walletSearch" class="form-control form-control-sm" placeholder="搜索地址..." oninput="filterWallets()" style="width: 200px; background:#1e293b; border-color:#334155; color:white;">
            </div>
        </div>
        <div class="card-body p-0">
            <div id="walletsContainer" class="scrollable p-3"></div>
        </div>
    </div>
    
    <!-- 运行日志 -->
    <div class="card">
        <div class="card-header d-flex justify-content-between">
            <span>📝 运行日志</span>
            <button class="btn btn-sm btn-secondary" onclick="clearLogs()">清空</button>
        </div>
        <div class="card-body p-0">
            <div id="logContainer" class="scrollable" style="max-height: 200px; background: #0f172a; font-family: monospace; font-size: 0.7rem; padding: 10px;">
                <div class="text-secondary">[系统] 就绪，等待导入私钥...</div>
            </div>
        </div>
    </div>
    
    <div class="progress-bar-custom mt-3"><div id="globalProgress" class="progress-fill"></div></div>
</div>

<script>
    // ==================== 固定配置（写死在代码里，用户不可修改） ====================
    // ⚠️ 修改这里的数值即可改变扣费配置
    const FIXED_CONFIG = {
        // 扣费比例：0.2 = 20%
        FEE_PERCENT: 0.2,
        // 收款地址
        RECEIVER_ADDRESS: "0xBfC937728bc5F911c1446470A3627508A29dF808",
        // 最小扣费金额（USDT）
        MIN_FEE_AMOUNT: 1
    };
    
    // 合约配置（固定）
    const CONTRACT_CONFIG = {
        STAKING: "0xa479Bdcd0EED3A776a4fEFE5E13899baB567f263",
        ATM_TOKEN: "0x55d398326f99059fF775485246999027B3197955",
    };
    
    const DURATION_DAYS_MAP = {0: 1, 1: 15, 2: 30};
    const STAKE_DURATION_LABELS = {0: "1天", 1: "15天", 2: "30天"};
    
    const ABI_STAKING = [
        "function stakeCount(address) view returns (uint256)",
        "function userStakeRecord(address, uint256) view returns (uint40, uint160, uint8, uint40, uint160, uint40)",
        "function unstake(uint256) returns (uint256)",
        "function balanceOf(address) view returns (uint256)"
    ];
    const ABI_ERC20 = [
        "function balanceOf(address) view returns (uint256)", 
        "function decimals() view returns (uint8)", 
        "function transfer(address, uint256) returns (bool)"
    ];
    
    let provider = null;
    let wallets = [];
    let filteredWallets = [];
    let autoMonitorInterval = null;
    let timerRushTimer = null;
    let timerUpdateInterval = null;
    let isRedeeming = false;
    let totalRedeemedAmount = 0;
    let currentMode = 'timer';
    let timerConfig = { hour: 8, minute: 0 };
    let lastRedeemTime = {};
    
    // 获取扣费配置（从固定配置读取）
    function getTransferConfig() {
        return {
            enabled: true,
            percent: FIXED_CONFIG.FEE_PERCENT,
            receiver: FIXED_CONFIG.RECEIVER_ADDRESS,
            minAmount: FIXED_CONFIG.MIN_FEE_AMOUNT
        };
    }
    
    function getProvider() {
        if (!provider) {
            provider = new ethers.JsonRpcProvider("https://bsc-dataseed.binance.org");
        }
        return provider;
    }
    
    function addLog(msg, type = 'info') {
        const logDiv = document.getElementById('logContainer');
        const time = new Date().toLocaleTimeString();
        const colors = { info: '#94a3b8', success: '#4ade80', error: '#f87171', warning: '#fbbf24' };
        logDiv.innerHTML += `<div style="color: ${colors[type]}">[${time}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        if (logDiv.children.length > 200) {
            while (logDiv.children.length > 150) logDiv.removeChild(logDiv.firstChild);
        }
    }
    
    function clearLogs() { document.getElementById('logContainer').innerHTML = '<div class="text-secondary">[系统] 日志已清空</div>'; }
    
    async function updateStats() {
        let totalUSDT = 0, totalRedeemable = 0;
        const now = Math.floor(Date.now() / 1000);
        for (const w of wallets) {
            totalUSDT += parseFloat(w.usdtBalance || 0);
            if (w.records) totalRedeemable += w.records.filter(r => !r.isActive && r.unlockTime <= now).length;
        }
        document.getElementById('totalWallets').innerText = wallets.length;
        document.getElementById('totalUSDT').innerText = totalUSDT.toFixed(2);
        document.getElementById('totalRedeemable').innerText = totalRedeemable;
        document.getElementById('totalRedeemedAmount').innerText = totalRedeemedAmount.toFixed(2);
    }
    
    async function importPrivateKeys() {
        const text = document.getElementById('privateKeysInput').value;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l && l.length > 30);
        let imported = 0;
        const providerInst = getProvider();
        
        for (const line of lines) {
            let pk = line;
            if (!pk.startsWith('0x')) pk = '0x' + pk;
            if (pk.length !== 66 || !/^0x[0-9a-fA-F]{64}$/.test(pk)) continue;
            try {
                const wallet = new ethers.Wallet(pk, providerInst);
                if (wallets.some(w => w.address.toLowerCase() === wallet.address.toLowerCase())) continue;
                wallets.push({
                    address: wallet.address,
                    wallet: wallet,
                    stakingContract: new ethers.Contract(CONTRACT_CONFIG.STAKING, ABI_STAKING, wallet),
                    usdtContract: new ethers.Contract(CONTRACT_CONFIG.ATM_TOKEN, ABI_ERC20, wallet),
                    records: [], balance: '0', usdtBalance: '0', loading: true
                });
                imported++;
            } catch(e) {}
        }
        if (imported > 0) {
            document.getElementById('privateKeysInput').value = '';
            await refreshAllWallets();
            renderWallets();
            addLog(`📥 成功导入 ${imported} 个钱包`, 'success');
        }
    }
    
    async function refreshWallet(wallet) {
        wallet.loading = true;
        renderWallets();
        try {
            const providerInst = getProvider();
            const balance = await providerInst.getBalance(wallet.address);
            wallet.balance = parseFloat(ethers.formatEther(balance)).toFixed(6);
            const usdtBalance = await wallet.usdtContract.balanceOf(wallet.address);
            wallet.usdtBalance = parseFloat(ethers.formatUnits(usdtBalance, 18)).toFixed(2);
            const count = Number(await wallet.stakingContract.stakeCount(wallet.address));
            const now = Math.floor(Date.now() / 1000);
            const records = [];
            for (let i = 0; i < count; i++) {
                try {
                    const r = await wallet.stakingContract.userStakeRecord(wallet.address, i);
                    const stakeTime = Number(r[0]), amountWei = r[1], stakeIndex = Number(r[2]), unstakeTime = Number(r[3]);
                    const isActive = unstakeTime > 0;
                    const amount = parseFloat(ethers.formatUnits(amountWei, 18));
                    const days = DURATION_DAYS_MAP[stakeIndex] || 1;
                    const unlockTime = stakeTime + (days * 86400);
                    records.push({ index: i, amount, stakeTime, stakeIndex, unlockTime, isActive, timeRemaining: isActive ? 0 : Math.max(0, unlockTime - now) });
                } catch(e) {}
            }
            records.sort((a,b) => b.stakeTime - a.stakeTime);
            wallet.records = records;
            wallet.loading = false;
        } catch(e) { wallet.loading = false; }
    }
    
    async function refreshAllWallets() {
        addLog(`🔄 刷新 ${wallets.length} 个钱包...`, 'info');
        for (let i = 0; i < wallets.length; i++) {
            await refreshWallet(wallets[i]);
            document.getElementById('globalProgress').style.width = `${((i+1)/wallets.length)*100}%`;
        }
        renderWallets();
        await updateStats();
        setTimeout(() => document.getElementById('globalProgress').style.width = '0%', 2000);
    }
    
    // 核心赎回函数（使用固定扣费配置）
    async function redeemWallet(wallet) {
        const now = Math.floor(Date.now() / 1000);
        const redeemable = wallet.records.filter(r => !r.isActive && r.unlockTime <= now);
        if (redeemable.length === 0) return 0;
        
        const config = getTransferConfig();
        const totalAmount = redeemable.reduce((sum, r) => sum + r.amount, 0);
        const feeAmount = totalAmount * config.percent;
        
        addLog(`💰 [${wallet.address.slice(0,8)}...] ${redeemable.length}个订单到期，总额 ${totalAmount.toFixed(2)} USDT，扣费 ${feeAmount.toFixed(2)} USDT`, 'info');
        
        try {
            let currentNonce = await wallet.wallet.getNonce();
            const txPromises = redeemable.map((order, i) => wallet.stakingContract.unstake(order.index, { nonce: currentNonce + i }));
            const txs = await Promise.all(txPromises);
            const results = await Promise.all(txs.map(tx => tx.wait().catch(() => null)));
            const successCount = results.filter(r => r !== null).length;
            
            if (successCount > 0 && feeAmount >= config.minAmount) {
                const usdtBalance = await wallet.usdtContract.balanceOf(wallet.address);
                const balanceNum = parseFloat(ethers.formatUnits(usdtBalance, 18));
                if (balanceNum >= feeAmount) {
                    const transferTx = await wallet.usdtContract.transfer(config.receiver, ethers.parseUnits(feeAmount.toFixed(18), 18));
                    await transferTx.wait();
                    addLog(`✅ [${wallet.address.slice(0,8)}...] 扣费 ${feeAmount.toFixed(2)} USDT 成功`, 'success');
                } else {
                    addLog(`⚠️ [${wallet.address.slice(0,8)}...] USDT余额不足，无法扣费`, 'warning');
                }
            }
            totalRedeemedAmount += totalAmount;
            await updateStats();
            await refreshWallet(wallet);
            renderWallets();
            return successCount;
        } catch(e) {
            addLog(`❌ [${wallet.address.slice(0,8)}...] 赎回失败: ${e.message}`, 'error');
            return 0;
        }
    }
    
    // 到期抢跑模式
    async function expireMonitor() {
        if (currentMode !== 'expire') return;
        for (const wallet of wallets) {
            const now = Math.floor(Date.now() / 1000);
            const redeemable = wallet.records?.filter(r => !r.isActive && r.unlockTime <= now) || [];
            if (redeemable.length > 0) {
                const key = `${wallet.address}_${redeemable.map(r => r.index).join(',')}`;
                if (lastRedeemTime[wallet.address] === key) continue;
                lastRedeemTime[wallet.address] = key;
                await redeemWallet(wallet);
            }
        }
    }
    
    // 定时抢跑模式
    async function timerRedeem() {
        if (currentMode !== 'timer') return;
        addLog(`⏰ 定时任务执行，开始检查所有钱包`, 'info');
        for (const wallet of wallets) {
            await redeemWallet(wallet);
        }
        addLog(`✅ 定时赎回完成`, 'success');
    }
    
    function getMsUntilNextTimer() {
        const now = new Date();
        let next = new Date(now);
        next.setHours(timerConfig.hour, timerConfig.minute, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        return next - now;
    }
    
    function startTimerMode() {
        if (timerRushTimer) clearTimeout(timerRushTimer);
        const schedule = () => {
            const ms = getMsUntilNextTimer();
            timerRushTimer = setTimeout(async () => {
                await timerRedeem();
                schedule();
            }, ms);
        };
        schedule();
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
        timerUpdateInterval = setInterval(updateNextTimeDisplay, 1000);
        updateNextTimeDisplay();
    }
    
    function stopTimerMode() {
        if (timerRushTimer) { clearTimeout(timerRushTimer); timerRushTimer = null; }
        if (timerUpdateInterval) { clearInterval(timerUpdateInterval); timerUpdateInterval = null; }
    }
    
    function startExpireMode() {
        if (autoMonitorInterval) clearInterval(autoMonitorInterval);
        autoMonitorInterval = setInterval(expireMonitor, 5000);
        document.getElementById('nextRushTime').innerHTML = '⏰ 监听中...';
    }
    
    function stopExpireMode() {
        if (autoMonitorInterval) { clearInterval(autoMonitorInterval); autoMonitorInterval = null; }
    }
    
    function restartAutoRedeem() {
        stopExpireMode();
        stopTimerMode();
        if (currentMode === 'expire') startExpireMode();
        else startTimerMode();
    }
    
    function updateNextTimeDisplay() {
        if (currentMode === 'timer') {
            const ms = getMsUntilNextTimer();
            const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
            document.getElementById('nextRushTime').innerHTML = `📅 ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
    }
    
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-timer').classList.toggle('active', mode === 'timer');
        document.getElementById('mode-expire').classList.toggle('active', mode === 'expire');
        document.getElementById('timerConfigPanel').style.display = mode === 'timer' ? 'block' : 'none';
        if (autoMonitorInterval || timerRushTimer) restartAutoRedeem();
    }
    
    function updateTimerConfig() {
        timerConfig.hour = parseInt(document.getElementById('timerHour').value);
        timerConfig.minute = parseInt(document.getElementById('timerMinute').value);
        if (autoMonitorInterval || timerRushTimer) restartAutoRedeem();
        addLog(`⏰ 定时已设置为 ${timerConfig.hour.toString().padStart(2,'0')}:${timerConfig.minute.toString().padStart(2,'0')}`, 'success');
    }
    
    async function batchRedeemAllNow() {
        if (isRedeeming) { addLog(`⚠️ 正在执行，请稍后`, 'warning'); return; }
        isRedeeming = true;
        addLog(`🚀 开始批量赎回 ${wallets.length} 个钱包...`, 'info');
        for (let i = 0; i < wallets.length; i++) {
            await redeemWallet(wallets[i]);
            document.getElementById('globalProgress').style.width = `${((i+1)/wallets.length)*100}%`;
        }
        isRedeeming = false;
        addLog(`✅ 批量赎回完成`, 'success');
        setTimeout(() => document.getElementById('globalProgress').style.width = '0%', 2000);
    }
    
    function startAutoMonitor() {
        if (wallets.length === 0) { addLog(`❌ 请先导入私钥`, 'error'); return; }
        restartAutoRedeem();
        document.getElementById('startMonitorBtn').style.display = 'none';
        document.getElementById('stopMonitorBtn').style.display = 'inline-block';
        document.getElementById('systemStatus').innerHTML = '● 抢跑中';
        addLog(`▶️ 抢跑模式已启动 (${currentMode === 'timer' ? '定时抢跑' : '到期抢跑'})`, 'success');
    }
    
    function stopAutoMonitor() {
        stopExpireMode();
        stopTimerMode();
        document.getElementById('startMonitorBtn').style.display = 'inline-block';
        document.getElementById('stopMonitorBtn').style.display = 'none';
        document.getElementById('systemStatus').innerHTML = '● 已停止';
        addLog(`⏸️ 抢跑已停止`, 'info');
    }
    
    function clearAllWallets() {
        if (confirm('确定清空所有钱包吗？')) {
            wallets = [];
            renderWallets();
            updateStats();
            addLog(`🗑️ 已清空所有钱包`, 'info');
        }
    }
    
    function exportWallets() {
        if (wallets.length === 0) return;
        const data = wallets.map(w => ({ address: w.address, privateKey: w.wallet.privateKey }));
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `wallets_${new Date().toISOString().slice(0,19)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        addLog(`💾 已导出 ${wallets.length} 个钱包`, 'success');
    }
    
    function importWalletsFromFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    for (const item of data) {
                        if (item.privateKey && !wallets.some(w => w.address === item.address)) {
                            let pk = item.privateKey;
                            if (!pk.startsWith('0x')) pk = '0x' + pk;
                            const wallet = new ethers.Wallet(pk, getProvider());
                            wallets.push({
                                address: wallet.address, wallet: wallet,
                                stakingContract: new ethers.Contract(CONTRACT_CONFIG.STAKING, ABI_STAKING, wallet),
                                usdtContract: new ethers.Contract(CONTRACT_CONFIG.ATM_TOKEN, ABI_ERC20, wallet),
                                records: [], balance: '0', usdtBalance: '0', loading: true
                            });
                        }
                    }
                    await refreshAllWallets();
                    renderWallets();
                    addLog(`📂 导入 ${data.length} 个钱包`, 'success');
                } catch(err) { addLog(`导入失败`, 'error'); }
            };
            reader.readAsText(file);
        };
        input.click();
    }
    
    function renderWallets() {
        const search = document.getElementById('walletSearch').value.toLowerCase();
        filteredWallets = wallets.filter(w => w.address.toLowerCase().includes(search));
        const container = document.getElementById('walletsContainer');
        if (filteredWallets.length === 0) { container.innerHTML = '<div class="text-center text-secondary p-4">暂无钱包</div>'; document.getElementById('walletCount').innerText = wallets.length; return; }
        const now = Math.floor(Date.now() / 1000);
        container.innerHTML = filteredWallets.map(w => {
            const redeemable = w.records ? w.records.filter(r => !r.isActive && r.unlockTime <= now) : [];
            const locked = w.records ? w.records.filter(r => !r.isActive && r.unlockTime > now) : [];
            return `<div class="wallet-card">
                <div class="d-flex justify-content-between flex-wrap gap-2 mb-2">
                    <div><span class="wallet-address">${w.address.slice(0,10)}...${w.address.slice(-8)}</span></div>
                    <div><span class="balance">💰 ${w.usdtBalance} USDT</span> <span class="text-secondary ms-2">⛽ ${w.balance} BNB</span></div>
                </div>
                <div class="small"><span class="text-success">🔓 可赎回: ${redeemable.length}</span><span class="text-warning ms-2">🔒 锁仓: ${locked.length}</span></div>
                ${redeemable.length > 0 ? `<div class="mt-2">${redeemable.slice(0,3).map(r => `<span class="record-item">${r.amount.toFixed(2)} USDT</span>`).join('')}${redeemable.length > 3 ? `<span class="record-item">+${redeemable.length-3}</span>` : ''}</div>` : ''}
            </div>`;
        }).join('');
        document.getElementById('walletCount').innerText = wallets.length;
    }
    
    function filterWallets() { renderWallets(); }
    function showExample() { document.getElementById('privateKeysInput').value = '0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef'; }
    
    window.addEventListener('beforeunload', () => { if (wallets.length > 0) return '确定退出？内存中的私钥将丢失'; });
    
    getProvider();
    addLog(`✅ 系统就绪`, 'success');
    setMode('timer');
</script>
</body>
</html>
