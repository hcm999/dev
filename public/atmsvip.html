<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATM 极速抢跑 - 后端托管版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f1c; color: #eef2ff; font-family: 'Inter', 'Segoe UI', sans-serif; padding: 16px; }
        .card { background: #111827; border: 1px solid #1f2a3e; border-radius: 20px; margin-bottom: 20px; }
        .card-header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 20px; font-weight: 600; border-radius: 20px 20px 0 0; color: #fbbf24; }
        .card-body { padding: 16px; }
        .btn-success { background: #10b981; border: none; border-radius: 40px; }
        .btn-auto { background: #8b5cf6; border: none; border-radius: 40px; color: white; font-weight: 500; padding: 8px 20px; }
        .btn-danger { background: #dc2626; border: none; border-radius: 40px; }
        .timer-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: #fbbf24; background: #0f172a; padding: 4px 12px; border-radius: 30px; }
        .table { color: #e2e8f0; font-size: 0.8rem; }
        .table thead th { border-bottom: 1px solid #2d3a5e; color: #9ca3af; padding: 8px 4px; text-align: center; }
        .table td { border-bottom: 1px solid #1f2a3e; padding: 8px 4px; text-align: center; }
        .amount-value { color: #ffd966; font-weight: 700; }
        .log-container { max-height: 250px; overflow-y: auto; background: #0f172a; font-family: monospace; font-size: 0.7rem; padding: 10px; border-radius: 12px; }
        .eip-badge { background: linear-gradient(135deg, #8b5cf6, #3b82f6); padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .gas-slider { width: 100%; background: #1e293b; -webkit-appearance: none; border-radius: 10px; height: 4px; }
        .gas-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: #fbbf24; border-radius: 50%; cursor: pointer; }
        .form-control { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 40px; padding: 10px 18px; width: 100%; }
        .mode-selector { display: flex; gap: 10px; background: #0f172a; padding: 4px; border-radius: 40px; display: inline-flex; }
        .mode-btn { background: transparent; border: none; padding: 6px 16px; border-radius: 40px; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .info-bar { background: #1e293b; border-radius: 20px; padding: 12px 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .info-item { background: #0f172a; padding: 8px 16px; border-radius: 40px; }
        .info-label { font-size: 0.7rem; color: #94a3b8; }
        .info-value { font-size: 1.1rem; font-weight: bold; color: #fbbf24; }
    </style>
</head>
<body>
<div class="container-fluid" style="max-width: 1200px;">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h2 class="fw-bold"><span style="background: linear-gradient(135deg,#c084fc,#3b82f6); -webkit-background-clip:text; background-clip:text; color:transparent;">⚡ ATM 极速抢跑 · 后端托管版</span></h2>
            <p class="small text-secondary"><span class="eip-badge">后端托管</span> 核心逻辑受保护 · 12节点并行</p>
        </div>
        <div><span id="statusBadge" class="badge bg-secondary">⚪ 未启动</span></div>
    </div>

    <div class="info-bar">
        <div class="info-item"><div class="info-label">📊 选中仓位</div><div class="info-value" id="selectedCount">0</div></div>
        <div class="info-item"><div class="info-label">💰 总金额 (USDT)</div><div class="info-value" id="totalAmount">0.00</div></div>
        <div class="info-item"><div class="info-label">💸 扣费30%</div><div class="info-value" id="totalFee">0.00</div></div>
        <div class="info-item"><div class="info-label">🎯 预签名状态</div><div class="info-value" id="presignStatus">未准备</div></div>
        <div class="info-item"><div class="info-label">🌐 广播节点</div><div class="info-value" id="activeNodes">12</div></div>
    </div>

    <div class="card">
        <div class="card-header">🔐 Step 1 — 导入私钥</div>
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-8"><input type="password" id="privateKeyInput" class="form-control" placeholder="粘贴私钥 (64位十六进制)"></div>
                <div class="col-md-4"><button class="btn btn-success w-100" onclick="enableAutoRedeem()">📥 导入并启用</button></div>
            </div>
            <div id="walletInfo" class="mt-2 small" style="display:none;">✅ 已激活 | 地址: <span id="walletAddress" class="text-success"></span></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">⚙️ Step 2 — 抢跑配置</div>
        <div class="card-body">
            <div class="row g-4 align-items-center">
                <div class="col-md-3">
                    <label class="form-label small text-secondary">Gas 倍数</label>
                    <div class="d-flex gap-2 align-items-center">
                        <input type="range" id="gasMultiplier" class="gas-slider" min="1.0" max="5.0" step="0.1" value="2.5">
                        <span id="gasMultiplierValue" class="badge bg-info">2.5x</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="refreshMyStakes()">🔄 扫描仓位</button>
                </div>
                <div class="col-md-3">
                    <button id="batchRedeemBtn" class="btn btn-success w-100" onclick="batchRedeemAll()" disabled>⚡ 立即赎回</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">📊 Step 3 — 已选仓位（最多5个）</div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead><tr><th>Index</th><th>金额 (USDT)</th><th>档位</th><th>评分风险</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="stakeListBody"><tr><td colspan="6" class="text-center">⚡ 导入私钥后自动加载</tr</tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between"><span>📝 执行日志</span><button class="btn btn-sm btn-secondary" onclick="clearLogs()">清空</button></div>
        <div class="card-body p-0"><div id="logContainer" class="log-container"><div class="text-secondary">[系统] 就绪，导入私钥开始使用...</div></div></div>
    </div>
</div>

<script>
    // ==================== 配置 ====================
    const API_BASE = '/api/atm-rush';
    
    let currentPrivateKey = null;
    let currentAddress = null;
    let myStakeRecords = [];
    let preparedSignedTx = null;
    let preparedIndices = [];
    let preparedTotalAmount = 0;
    let gasMultiplier = 2.5;
    let isAutoRedeemEnabled = false;
    let currentMode = 'dual';
    let blockListener = null;
    let timerRushTimer = null;
    let timerUpdateInterval = null;
    let isProcessing = false;
    let hasTriggered = false;
    
    function addLog(msg, type = 'info') {
        const logDiv = document.getElementById('logContainer');
        const time = new Date().toLocaleTimeString();
        const colors = { info: '#94a3b8', success: '#4ade80', error: '#f87171', warning: '#fbbf24', important: '#f97316' };
        logDiv.innerHTML += `<div style="color: ${colors[type] || '#94a3b8'}">[${time}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
        if (logDiv.children.length > 200) {
            while (logDiv.children.length > 150) logDiv.removeChild(logDiv.firstChild);
        }
    }
    
    function clearLogs() { document.getElementById('logContainer').innerHTML = '<div class="text-secondary">[系统] 日志已清空</div>'; }
    function shorten(addr) { if (!addr) return ""; return addr.slice(0,6)+"..."+addr.slice(-4); }
    
    async function callApi(action, data = {}) {
        const res = await fetch(API_BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, privateKey: currentPrivateKey, gasMultiplier, ...data })
        });
        return await res.json();
    }
    
    function scoreOrder(order) {
        let score = 0;
        score += Math.min(order.amountNum / 20, 50);
        score += order.stakeIndex === 2 ? 30 : (order.stakeIndex === 1 ? 20 : 10);
        score += Math.min(order.timeRemaining / 86400 * 20, 20);
        return score;
    }
    
    function getRiskLevel(score) {
        if (score >= 90) return '低';
        if (score >= 70) return '中';
        return '高';
    }
    
    function getTopOrders(limit = 5) {
        const redeemable = myStakeRecords.filter(r => !r.isActive && r.timeRemaining <= 0);
        const scored = redeemable.map(r => ({ ...r, score: scoreOrder(r) }));
        scored.sort((a, b) => b.score - a.score);
        return scored.slice(0, limit);
    }
    
    async function refreshMyStakes() {
        if (!currentPrivateKey) { addLog('请先导入私钥', 'error'); return; }
        
        addLog(`🔄 扫描仓位...`, 'info');
        try {
            const data = await callApi('scanStakes');
            if (!data.success) { addLog(`扫描失败: ${data.error}`, 'error'); return; }
            
            currentAddress = data.address;
            myStakeRecords = data.topOrders;
            
            document.getElementById('selectedCount').innerHTML = data.topOrders.length;
            document.getElementById('totalAmount').innerHTML = data.totalAmount.toFixed(2);
            document.getElementById('totalFee').innerHTML = data.feeAmount.toFixed(2);
            document.getElementById('batchRedeemBtn').disabled = data.topOrders.length === 0;
            document.getElementById('walletInfo').style.display = 'block';
            document.getElementById('walletAddress').innerHTML = shorten(currentAddress);
            
            renderStakeList();
            
            if (data.topOrders.length > 0) {
                await prepareSignatures();
            }
        } catch(e) {
            addLog(`扫描失败: ${e.message}`, 'error');
        }
    }
    
    function renderStakeList() {
        const tbody = document.getElementById('stakeListBody');
        const topOrders = getTopOrders(5);
        
        if (topOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">暂无到期订单</tr</tbody>';
            return;
        }
        let html = '';
        for (let r of topOrders) {
            let score = scoreOrder(r);
            let risk = getRiskLevel(score);
            let status = r.timeRemaining <= 0 ? '<span class="text-success">待发送</span>' : '<span class="text-warning">锁仓中</span>';
            html += `<tr>
                <td>${r.index}</td>
                <td class="amount-value">${r.amount}</td>
                <td>${r.durationLabel}</td>
                <td>${Math.floor(score)}—${risk}</td>
                <td>${status}</td>
                <td><button class="btn btn-sm btn-warning" onclick="handleUnstake(${r.index})">赎回</button></td>
            </tr>`;
        }
        tbody.innerHTML = html;
    }
    
    async function prepareSignatures() {
        const topOrders = getTopOrders(5);
        if (topOrders.length === 0) return false;
        
        preparedIndices = topOrders.map(r => r.index);
        preparedTotalAmount = topOrders.reduce((s, r) => s + r.amountNum, 0);
        
        addLog(`📊 选中 ${preparedIndices.length} 个订单，总额 ${preparedTotalAmount.toFixed(2)} USDT`, 'info');
        
        try {
            const data = await callApi('prepare', { indices: preparedIndices });
            if (data.success) {
                preparedSignedTx = data.signedTx;
                document.getElementById('presignStatus').innerHTML = `✅ ${preparedIndices.length}个 (${preparedTotalAmount.toFixed(0)}U)`;
                addLog(`📝 预签名完成: ${preparedIndices.length} 个订单`, 'success');
                return true;
            } else {
                document.getElementById('presignStatus').innerHTML = '❌ 失败';
                addLog(`❌ 预签名失败: ${data.error}`, 'error');
                return false;
            }
        } catch(e) {
            document.getElementById('presignStatus').innerHTML = '❌ 失败';
            addLog(`❌ 预签名错误: ${e.message}`, 'error');
            return false;
        }
    }
    
    async function batchRedeemAll() {
        if (!currentPrivateKey) { alert("请先导入私钥"); return; }
        if (isProcessing) return;
        
        const topOrders = getTopOrders(5);
        if (topOrders.length === 0) { alert("没有可赎回订单"); return; }
        
        const indices = topOrders.map(r => r.index);
        const totalAmount = topOrders.reduce((s, r) => s + r.amountNum, 0);
        
        isProcessing = true;
        const btn = document.getElementById('batchRedeemBtn');
        btn.disabled = true;
        btn.innerText = `赎回中...`;
        
        try {
            const data = await callApi('redeem', { indices: indices });
            if (data.success) {
                addLog(`✅ 批量提交成功！${indices.length} 个订单`, 'success');
                addLog(`📋 交易Hash: ${data.txHash.slice(0,16)}...`, 'info');
                if (data.transferHash) {
                    addLog(`💰 扣费 ${data.transferAmount.toFixed(2)} USDT 成功`, 'success');
                }
                alert(`✅ 批量提交成功！\n订单: ${indices.length}\n金额: ${totalAmount.toFixed(2)} USDT`);
                await refreshMyStakes();
            } else {
                addLog(`❌ 失败: ${data.error}`, 'error');
                alert("失败: " + data.error);
            }
        } catch(e) {
            addLog(`❌ 失败: ${e.message}`, 'error');
            alert("失败: " + e.message);
        }
        isProcessing = false;
        btn.disabled = false;
        btn.innerText = "⚡ 立即赎回";
    }
    
    async function handleUnstake(index) {
        if (!currentPrivateKey) { alert("请先导入私钥"); return; }
        addLog(`🔄 赎回订单 ${index}...`, 'info');
        try {
            const data = await callApi('redeem', { indices: [index] });
            if (data.success) {
                addLog(`✅ 订单 ${index} 提交成功`, 'success');
                alert(`订单 ${index} 提交成功！`);
                await refreshMyStakes();
            } else {
                addLog(`❌ 失败: ${data.error}`, 'error');
                alert("赎回失败: " + data.error);
            }
        } catch(e) {
            addLog(`❌ 失败: ${e.message}`, 'error');
            alert("赎回失败: " + e.message);
        }
    }
    
    async function sendRushTransaction(triggerSource = 'unknown') {
        if (!preparedSignedTx || preparedIndices.length === 0) return false;
        if (isProcessing) return false;
        if (hasTriggered) return false;
        
        hasTriggered = true;
        isProcessing = true;
        addLog(`🚀 [${triggerSource}] 发送抢跑！${preparedIndices.length} 个订单`, 'important');
        
        try {
            const data = await callApi('broadcast', { signedTx: preparedSignedTx });
            if (data.success) {
                addLog(`✅ 抢跑成功！${data.successCount}/${data.totalNodes} 节点成功`, 'success');
                if (data.firstHash) {
                    addLog(`📋 交易Hash: ${data.firstHash.slice(0,16)}...`, 'info');
                }
                await refreshMyStakes();
                return true;
            } else {
                addLog(`❌ 抢跑失败`, 'error');
                return false;
            }
        } catch(e) {
            addLog(`❌ 抢跑失败: ${e.message}`, 'error');
            return false;
        } finally {
            isProcessing = false;
        }
    }
    
    // 区块监听
    async function startBlockListener() {
        addLog(`🎧 区块监听已启动（模拟）`, 'success');
        // 实际区块监听需要 WebSocket，这里简化
    }
    
    function stopBlockListener() {}
    
    function startTimerFallback() {
        if (timerRushTimer) clearTimeout(timerRushTimer);
        const now = new Date();
        let target = new Date(now);
        target.setUTCHours(0, 0, 0, 0);
        if (target <= now) target.setDate(target.getDate() + 1);
        const waitMs = target.getTime() - now.getTime();
        
        if (waitMs > 0) {
            timerRushTimer = setTimeout(async () => {
                if (isAutoRedeemEnabled && !hasTriggered) {
                    addLog(`⏰ 定时器触发 (UTC 0:00)`, 'important');
                    await sendRushTransaction('定时器');
                }
                startTimerFallback();
            }, waitMs);
            const h = Math.floor(waitMs/3600000), m = Math.floor((waitMs%3600000)/60000), s = Math.floor((waitMs%60000)/1000);
            addLog(`⏰ 定时器已启动，距离抢跑 ${h}h ${m}m ${s}s`, 'success');
        }
    }
    
    function stopTimerFallback() {
        if (timerRushTimer) { clearTimeout(timerRushTimer); timerRushTimer = null; }
    }
    
    function restartAutoRedeem() {
        stopBlockListener();
        stopTimerFallback();
        hasTriggered = false;
        startBlockListener();
        if (currentMode === 'dual') startTimerFallback();
        addLog(`🛡️ 抢跑已启动 | 模式: ${currentMode === 'dual' ? '区块监听+定时器' : '仅区块监听'}`, 'success');
    }
    
    function stopAutoRedeem() {
        isAutoRedeemEnabled = false;
        stopBlockListener();
        stopTimerFallback();
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
        document.getElementById('autoRedeemBtn').style.display = 'inline-block';
        document.getElementById('stopAutoBtn').style.display = 'none';
        document.getElementById('statusBadge').innerHTML = '⚪ 已停止';
        document.getElementById('statusBadge').classList.remove('bg-success');
        document.getElementById('statusBadge').classList.add('bg-secondary');
        addLog(`⏸️ 抢跑已停止`, 'info');
    }
    
    function startAutoRedeem() {
        if (!currentPrivateKey) { alert("请先导入私钥"); return; }
        isAutoRedeemEnabled = true;
        hasTriggered = false;
        restartAutoRedeem();
        document.getElementById('autoRedeemBtn').style.display = 'none';
        document.getElementById('stopAutoBtn').style.display = 'inline-block';
        document.getElementById('statusBadge').innerHTML = '🟢 抢跑中';
        document.getElementById('statusBadge').classList.remove('bg-secondary');
        document.getElementById('statusBadge').classList.add('bg-success');
        addLog(`▶️ 抢跑已启动 | Gas: ${gasMultiplier}x`, 'success');
    }
    
    function setMode(mode) {
        currentMode = mode;
        document.getElementById('mode-dual').classList.toggle('active', mode === 'dual');
        document.getElementById('mode-block').classList.toggle('active', mode === 'block');
        if (isAutoRedeemEnabled && currentPrivateKey) {
            restartAutoRedeem();
        }
        addLog(`📌 模式: ${mode === 'dual' ? '区块监听+定时器' : '仅区块监听'}`, 'info');
    }
    
    async function enableAutoRedeem() {
        let pk = document.getElementById('privateKeyInput').value.trim();
        if (!pk) { alert("请输入私钥"); return; }
        if (pk.startsWith('0x')) pk = pk.slice(2);
        if (pk.length !== 64) { alert("私钥应为64位十六进制"); return; }
        
        currentPrivateKey = pk;
        
        try {
            const data = await callApi('scanStakes');
            if (data.success) {
                currentAddress = data.address;
                document.getElementById('walletInfo').style.display = 'block';
                document.getElementById('walletAddress').innerHTML = shorten(currentAddress);
                document.getElementById('autoRedeemBtn').style.display = 'inline-block';
                document.getElementById('batchRedeemBtn').disabled = false;
                addLog(`✅ 已激活: ${shorten(currentAddress)}`, 'success');
                await refreshMyStakes();
                alert(`✅ 导入成功！\n地址: ${currentAddress}\n点击「启动 UTC 0:00 定时赎回」`);
            } else {
                addLog(`❌ 私钥无效: ${data.error}`, 'error');
                alert("私钥无效");
            }
        } catch(e) {
            addLog(`❌ 私钥无效: ${e.message}`, 'error');
            alert("私钥无效");
        }
    }
    
    // Gas 倍数监听
    const gasSlider = document.getElementById('gasMultiplier');
    if (gasSlider) {
        gasSlider.addEventListener('input', (e) => {
            gasMultiplier = parseFloat(e.target.value);
            document.getElementById('gasMultiplierValue').innerText = gasMultiplier.toFixed(1) + 'x';
            if (currentPrivateKey && myStakeRecords.length > 0) {
                prepareSignatures();
            }
        });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('activeNodes').innerHTML = '12';
    });
    
    window.handleUnstake = handleUnstake;
    window.batchRedeemAll = batchRedeemAll;
    window.refreshMyStakes = refreshMyStakes;
    window.setMode = setMode;
    window.startAutoRedeem = startAutoRedeem;
    window.stopAutoRedeem = stopAutoRedeem;
    window.enableAutoRedeem = enableAutoRedeem;
    window.clearLogs = clearLogs;
</script>
</body>
</html>
