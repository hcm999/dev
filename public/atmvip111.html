<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ATM智能抢跑自动赎回 - 并行版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f1c; color: #eef2ff; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
        .card { background: #111827; border: 1px solid #1f2a3e; border-radius: 20px; backdrop-filter: blur(2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .btn-primary { background: #2563eb; border: none; border-radius: 40px; font-weight: 500; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-success { background: #0d9488; border: none; border-radius: 40px; }
        .btn-warning { background: #eab308; color: #0f172a; border: none; border-radius: 40px; font-weight: 500; }
        .btn-danger { background: #dc2626; border-radius: 40px; }
        .stat-value { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #fbbf24, #f97316); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
        .table { color: #e2e8f0; font-size: 0.85rem; width: 100%; table-layout: fixed; }
        .table thead th { border-bottom: 1px solid #2d3a5e; color: #9ca3af; padding: 8px 2px; text-align: center; }
        .table td { border-bottom: 1px solid #1f2a3e; vertical-align: middle; padding: 8px 2px; text-align: center; }
        .amount-value { color: #ffd966; font-weight: 700; }
        .sub-tab { background: #1e293b; border: 1px solid #475569; border-radius: 40px; padding: 5px 18px; cursor: pointer; font-size: 0.8rem; color: #e2e8f0; }
        .sub-tab.active { background: #3b82f6; color: white; }
        .auto-status-bar {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .mode-selector { display: flex; gap: 10px; background: #0f172a; padding: 4px; border-radius: 40px; }
        .mode-btn { background: transparent; border: none; padding: 6px 16px; border-radius: 40px; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
        .mode-btn.active { background: #3b82f6; color: white; }
        .btn-auto { background: #8b5cf6; border: none; border-radius: 40px; color: white; font-weight: 500; padding: 8px 20px; }
        .timer-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: #fbbf24; background: #0f172a; padding: 4px 12px; border-radius: 30px; }
        .auto-status-text.active { color: #10b981; }
        .data-source-badge { background: #1e293b; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; color: #94a3b8; }
        .data-source-badge.private-key-mode { background: #8b5cf6; color: white; }
        .progress-bar-custom { height: 4px; background: #2d3a5e; border-radius: 2px; margin-top: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #8b5cf6, #3b82f6); transition: width 0.3s; }
    </style>
</head>
<body>
<div class="container py-4 py-md-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div>
            <h2 class="fw-bold" style="background: linear-gradient(135deg,#c084fc,#3b82f6); -webkit-background-clip:text; background-clip:text; color:transparent;">⚡ ATM 智能赎回</h2>
            <p class="small text-secondary">⚡ 多笔并行提交版 | 同时提交所有订单 | QQ601483868</p>
        </div>
        <button id="connectBtn" class="btn btn-primary px-4" onclick="connectWallet()">🔌 连接钱包</button>
    </div>

    <!-- 自动赎回控制栏 -->
    <div class="auto-status-bar">
        <div>
            <span class="badge bg-secondary me-2">🤖 抢跑模式</span>
            <span id="autoStatusText" class="auto-status-text">未启用</span>
        </div>
        <div class="mode-selector">
            <button class="mode-btn" id="mode-expire" onclick="setMode('expire')">⏰ 到期抢跑</button>
            <button class="mode-btn" id="mode-timer" onclick="setMode('timer')">📅 定时抢跑</button>
        </div>
        <div id="timerConfigPanel" style="display:none;">
            <div class="time-input-group d-flex gap-2 align-items-center">
                <input type="number" id="timerHour" min="0" max="23" value="8" style="width:55px;" class="form-control form-control-sm"> <span>时</span>
                <input type="number" id="timerMinute" min="0" max="59" value="0" style="width:55px;" class="form-control form-control-sm"> <span>分</span>
                <input type="number" id="timerSecond" min="0" max="59" value="0" style="width:55px;" class="form-control form-control-sm"> <span>秒</span>
                <button class="btn btn-sm btn-outline-light" onclick="updateTimerConfig()">应用</button>
            </div>
        </div>
        <div id="expireDesc" class="mode-desc" style="color:#fbbf24;">⏰ 订单到期后立即抢跑赎回（毫秒级）</div>
        <div class="d-flex gap-2">
            <div><span class="small text-secondary">⏱️ 下次执行: </span><span id="nextRushTime" class="timer-display">--:--:--</span></div>
            <button id="autoRedeemBtn" class="btn-auto" onclick="showPrivateKeyModal()">🔑 导入私钥启用</button>
            <button id="stopAutoBtn" class="btn btn-outline-danger" onclick="stopAutoRedeem()" style="display:none;">⏹️ 停止</button>
        </div>
    </div>

    <!-- 4大核心数据 -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">💰 USDT余额</div><div class="stat-value" id="myBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">🔒 合约内质押</div><div class="stat-value" id="stakedBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">🏦 池子储备</div><div class="stat-value" id="poolBalance">0.00</div></div></div>
        <div class="col-6 col-md-3"><div class="card p-3 text-center"><div class="stat-label">📊 总质押量</div><div class="stat-value" id="totalStaked">0.00</div></div></div>
    </div>

    <!-- 私钥导入模态框 -->
    <div id="privateKeyModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
        <div class="card" style="max-width:500px; margin:20px;">
            <div class="card-body">
                <h5 class="card-title">🔐 导入私钥</h5>
                <div class="alert alert-warning small">⚠️ 私钥仅保存在内存，刷新即清除</div>
                <input type="text" id="privateKeyInput" class="form-control" placeholder="0x... 或直接粘贴私钥">
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-success" onclick="enableAutoRedeem()">确认启用</button>
                    <button class="btn btn-secondary" onclick="closePrivateKeyModal()">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主选项卡 -->
    <div class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <ul class="nav nav-tabs mb-0" style="border-bottom: none;">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#myStakes">📋 我的质押记录 <span id="myStakeCount" class="badge bg-secondary ms-1">0</span></button></li>
                </ul>
                <div id="dataSourceBadge" class="data-source-badge">🔗 数据来源: 未连接</div>
            </div>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="myStakes">
                    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                        <div class="sub-tabs d-flex gap-2">
                            <span class="sub-tab active" onclick="filterMyStakes('all')">全部</span>
                            <span class="sub-tab" onclick="filterMyStakes('active')">锁仓中</span>
                            <span class="sub-tab" onclick="filterMyStakes('inactive')">已赎回</span>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-light" onclick="refreshMyStakes()">🔄 刷新</button>
                            <button class="btn btn-sm btn-outline-info ms-2" id="autoRefreshBtn" onclick="toggleAutoRefresh()">⏱️ 自动刷新: 关闭</button>
                            <button class="btn btn-sm btn-danger ms-2" id="batchRedeemBtn" onclick="batchRedeemAll()" disabled>⚡ 并行一键赎回</button>
                        </div>
                    </div>
                    <div class="progress-bar-custom"><div id="redeemProgress" class="progress-fill"></div></div>
                    <div class="table-responsive mt-3">
                        <table class="table table-hover">
                            <thead><tr><th>ID</th><th>金额</th><th>周期</th><th>质押时间</th><th>剩余时间</th><th>状态</th><th>操作</th></tr></thead>
                            <tbody id="stakeListBody"><tr><td colspan="7" class="text-center">⚡ 连接钱包查看记录</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-3 text-center small text-secondary">⚙️ 合约地址: <span id="contractAddrDisplay" class="contract-address"></span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ==================== 配置 ====================
    const CONFIG = {
        STAKING: "0xa479Bdcd0EED3A776a4fEFE5E13899baB567f263",
        ATM_TOKEN: "0x55d398326f99059fF775485246999027B3197955",
        BUB_PAIR: "0x659b44d603052132fd36cf048d9e0ba1e307ae3a",
    };
    
    const DURATION_DAYS_MAP = {0: 1, 1: 15, 2: 30};
    const STAKE_DURATION_LABELS = {0: "1天", 1: "15天", 2: "30天"};
    const ABI_ATM_STAKING = [{"inputs":[],"name":"balanceOf","outputs":[{"internalType":"uint256","name":"balance","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"user","type":"address"}],"name":"stakeCount","outputs":[{"internalType":"uint256","name":"count","type":"uint256"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"address","name":"","type":"address"},{"internalType":"uint256","name":"","type":"uint256"}],"name":"userStakeRecord","outputs":[{"internalType":"uint40","name":"stakeTime","type":"uint40"},{"internalType":"uint160","name":"amount","type":"uint160"},{"internalType":"uint8","name":"stakeIndex","type":"uint8"},{"internalType":"uint40","name":"unstakeTime","type":"uint40"},{"internalType":"uint160","name":"reward","type":"uint160"},{"internalType":"uint40","name":"restakeTime","type":"uint40"}],"stateMutability":"view","type":"function"},{"inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],"name":"unstake","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"nonpayable","type":"function"},{"inputs":[],"name":"totalSupply","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}];
    const ABI_ERC20 = ["function balanceOf(address) view returns (uint256)","function decimals() view returns (uint8)"];
    
    let provider, signer, userAddress, stakingContract, atmContract;
    let autoRefreshInterval = null, countdownInterval = null, myStakeRecords = [], currentFilter = 'all';
    let autoWallet = null, autoStakingContract = null, expireMonitorInterval = null, timerRushTimer = null, timerUpdateInterval = null;
    let isAutoRedeemEnabled = false, alreadyRedeemedIndices = new Set();
    let currentMode = 'expire', timerConfig = { hour: 8, minute: 0, second: 0 };
    
    function formatAmount(wei, d=18) { try { return parseFloat(ethers.formatUnits(wei, d)).toFixed(2); } catch(e){ return "0.00"; } }
    function formatAmountInteger(wei) { return Math.floor(parseFloat(ethers.formatUnits(wei, 18))).toString(); }
    function shorten(addr){ return addr?.slice(0,6)+"..."+addr?.slice(-4); }
    function formatStakeTimeSplit(ts) { try { const d=new Date(ts*1000); return { date:`${d.getMonth()+1}/${d.getDate()}`, time:d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }; } catch(e){ return {date:"错误",time:"错误"}; } }
    function formatTimeRemainingSplit(sec) { if(sec<=0) return {top:"0秒",bottom:""}; const d=Math.floor(sec/86400), h=Math.floor((sec%86400)/3600), m=Math.floor((sec%3600)/60), s=sec%60; let top="",bottom=""; if(d>0) top+=`${d}天`; if(h>0) top+=`${h}小时`; if(m>0) bottom+=`${m}分`; if(s>0) bottom+=`${s}秒`; return {top:top||"0小时",bottom:bottom||"0秒"}; }
    
    function getReadOnlyProvider() { if (!provider) provider = new ethers.JsonRpcProvider("https://bsc-dataseed.binance.org/"); return provider; }
    
    async function loadStakeRecordsByAddress(address) {
        if (!address) return [];
        const readProvider = getReadOnlyProvider();
        const contract = new ethers.Contract(CONFIG.STAKING, ABI_ATM_STAKING, readProvider);
        try {
            const count = Number(await contract.stakeCount(address));
            const records = [], now = Math.floor(Date.now() / 1000);
            for (let i = 0; i < count; i++) {
                try {
                    const r = await contract.userStakeRecord(address, i);
                    const stakeTime = Number(r[0]), stakeIndex = Number(r[2]), unstakeTime = Number(r[3]);
                    const isActive = unstakeTime > 0;
                    const days = DURATION_DAYS_MAP[stakeIndex] || 1;
                    const unlockTimestamp = stakeTime + (days * 86400);
                    records.push({ index: i, amount: formatAmountInteger(r[1]), stakeTime, isActive, stakeIndex, unlockTimestamp, timeRemaining: isActive ? 0 : Math.max(0, unlockTimestamp - now) });
                } catch(e) {}
            }
            records.sort((a,b) => b.stakeTime - a.stakeTime);
            return records;
        } catch(e) { return []; }
    }
    
    async function refreshMyStakesOnly() {
        let targetAddress = autoWallet?.address || userAddress;
        if (!targetAddress) { document.getElementById('stakeListBody').innerHTML = '<tr><td colspan="7" class="text-center">⚡ 连接钱包或导入私钥</td></tr>'; return; }
        const isPrivateKeyMode = !!autoWallet;
        const badge = document.getElementById('dataSourceBadge');
        if (isPrivateKeyMode) { badge.innerHTML = `🔑 私钥地址: ${shorten(targetAddress)}`; badge.classList.add('private-key-mode'); }
        else { badge.innerHTML = `🔗 连接钱包: ${shorten(targetAddress)}`; badge.classList.remove('private-key-mode'); }
        myStakeRecords = await loadStakeRecordsByAddress(targetAddress);
        try {
            const readProvider = getReadOnlyProvider();
            const atmRead = new ethers.Contract(CONFIG.ATM_TOKEN, ABI_ERC20, readProvider);
            const stakingRead = new ethers.Contract(CONFIG.STAKING, ABI_ATM_STAKING, readProvider);
            document.getElementById('myBalance').innerHTML = formatAmount(await atmRead.balanceOf(targetAddress));
            document.getElementById('stakedBalance').innerHTML = formatAmount(await stakingRead.balanceOf(targetAddress));
        } catch(e) {}
        renderStakeList();
        document.getElementById('myStakeCount').innerText = myStakeRecords.length;
        startCountdown();
    }
    
    function renderStakeList() {
        const tbody = document.getElementById('stakeListBody');
        if (!tbody) return;
        let filtered = myStakeRecords;
        if (currentFilter === 'active') filtered = myStakeRecords.filter(r => !r.isActive);
        else if (currentFilter === 'inactive') filtered = myStakeRecords.filter(r => r.isActive);
        if (filtered.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="text-center">暂无记录</td></tr>'; return; }
        let html = '';
        for (let r of filtered) {
            const isLocked = r.timeRemaining > 0 && !r.isActive;
            const isUnlocked = r.timeRemaining <= 0 && !r.isActive;
            const timeObj = formatStakeTimeSplit(r.stakeTime), remainObj = formatTimeRemainingSplit(r.timeRemaining);
            let status, action, remainHtml;
            if (r.isActive) { status = '<span class="text-muted">已提取</span>'; action = '-'; remainHtml = '-'; }
            else if (isLocked) { status = '<span class="text-danger">锁仓中</span>'; action = '<button class="btn btn-sm btn-secondary" disabled>等待解锁</button>'; remainHtml = `<div><span class="remaining-top">${remainObj.top}</span><span class="remaining-bottom">${remainObj.bottom}</span></div>`; }
            else { status = '<span class="text-success">可赎回</span>'; action = autoWallet ? `<button class="btn btn-sm btn-warning" onclick="handleUnstake(${r.index})">立即赎回</button>` : '<button class="btn btn-sm btn-secondary" disabled>需导入私钥</button>'; remainHtml = '<span class="remaining-top unlocked">已解锁</span>'; }
            html += `<tr><td class="id-value">${r.index}</td><td class="amount-value">${r.amount}</td><td class="badge-duration">${STAKE_DURATION_LABELS[r.stakeIndex]||"未知"}</td><td><div>${timeObj.date}<br>${timeObj.time}</div></td><td>${remainHtml}</td><td>${status}</td><td>${action}</td></tr>`;
        }
        tbody.innerHTML = html;
    }
    
    function startCountdown() {
        if (countdownInterval) clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            let now = Math.floor(Date.now() / 1000), changed = false;
            for (let r of myStakeRecords) {
                if (!r.isActive) { let nr = Math.max(0, r.unlockTimestamp - now); if (r.timeRemaining !== nr) { r.timeRemaining = nr; changed = true; } }
            }
            if (changed) renderStakeList();
        }, 1000);
    }
    
    function filterMyStakes(f) { currentFilter = f; ['all','active','inactive'].forEach(fn => document.getElementById(`filter-${fn}`)?.classList.toggle('active', fn === f)); renderStakeList(); }
    async function refreshMyStakes() { await refreshMyStakesOnly(); }
    
    // ========== 核心：并行批量赎回 ==========
    async function batchRedeemAll() {
        if (!autoWallet || !autoStakingContract) { alert("请先导入私钥"); return; }
        const redeemable = myStakeRecords.filter(r => !r.isActive && r.timeRemaining <= 0);
        if (redeemable.length === 0) { alert("没有可赎回的订单"); return; }
        if (!confirm(`⚡ 并行模式\n将同时提交 ${redeemable.length} 笔赎回交易\n\n优势：所有交易同时发出，无需等待每笔确认\n\n是否继续？`)) return;
        
        const btn = document.getElementById('batchRedeemBtn');
        const progressDiv = document.getElementById('redeemProgress');
        btn.disabled = true;
        btn.innerText = `并行提交中... (0/${redeemable.length})`;
        
        // 步骤1：并行发送所有交易
        const txPromises = redeemable.map(order => autoStakingContract.unstake(order.index));
        const txs = await Promise.all(txPromises);
        btn.innerText = `确认中... (0/${txs.length})`;
        
        // 步骤2：并行等待所有交易确认
        const waitPromises = txs.map(async (tx, idx) => {
            try {
                await tx.wait();
                alreadyRedeemedIndices.add(redeemable[idx].index);
                return { success: true, index: redeemable[idx].index };
            } catch(e) { return { success: false, index: redeemable[idx].index, error: e }; }
        });
        
        // 进度更新
        let completed = 0;
        const progressInterval = setInterval(() => {
            if (btn) btn.innerText = `确认中... (${completed}/${txs.length})`;
            if (progressDiv) progressDiv.style.width = `${(completed / txs.length) * 100}%`;
        }, 500);
        
        const results = await Promise.all(waitPromises);
        clearInterval(progressInterval);
        
        const successCount = results.filter(r => r.success).length;
        const failCount = results.filter(r => !r.success).length;
        
        await refreshMyStakesOnly();
        btn.disabled = false;
        btn.innerText = "⚡ 并行一键赎回";
        if (progressDiv) setTimeout(() => progressDiv.style.width = '0%', 2000);
        
        alert(`✅ 并行赎回完成！\n📊 成功: ${successCount} 个\n❌ 失败: ${failCount} 个\n\n⏱️ 所有交易已同时提交并确认`);
    }
    
    async function handleUnstake(index) {
        if (!autoWallet || !autoStakingContract) { alert("请先导入私钥"); return; }
        const btn = document.querySelector(`button[onclick="handleUnstake(${index})"]`);
        if (btn) { btn.innerText = "赎回中..."; btn.disabled = true; }
        try { const tx = await autoStakingContract.unstake(index); await tx.wait(); alert("赎回成功！"); await refreshMyStakesOnly(); }
        catch(e) { alert("赎回失败: " + e.message); if(btn) { btn.innerText = "立即赎回"; btn.disabled = false; } }
    }
    
    // 抢跑监控
    async function checkExpiredOrdersAndRedeem() {
        if (!autoWallet || !autoStakingContract || currentMode !== 'expire') return;
        const now = Math.floor(Date.now() / 1000);
        for (let i = 0; i < myStakeRecords.length; i++) {
            const r = myStakeRecords[i];
            if (r.isActive || alreadyRedeemedIndices.has(i)) continue;
            if (now >= r.unlockTimestamp - 1) {
                console.log(`🔥 到期抢跑订单 ${i}`);
                try { await autoStakingContract.unstake(i); alreadyRedeemedIndices.add(i); await refreshMyStakesOnly(); } catch(e) {}
                await new Promise(r => setTimeout(r, 500));
            }
        }
    }
    
    async function executeTimerRedeem() {
        if (!autoWallet || !autoStakingContract) return;
        const now = Math.floor(Date.now() / 1000);
        for (let i = 0; i < myStakeRecords.length; i++) {
            const r = myStakeRecords[i];
            if (r.isActive) continue;
            if (now >= r.unlockTimestamp - 1) {
                try { await autoStakingContract.unstake(i); await refreshMyStakesOnly(); } catch(e) {}
                await new Promise(r => setTimeout(r, 300));
            }
        }
    }
    
    function startExpireMode() { if (expireMonitorInterval) clearInterval(expireMonitorInterval); expireMonitorInterval = setInterval(() => checkExpiredOrdersAndRedeem(), 1000); }
    function stopExpireMode() { if (expireMonitorInterval) { clearInterval(expireMonitorInterval); expireMonitorInterval = null; } }
    function startTimerMode() { if (timerRushTimer) clearTimeout(timerRushTimer); const schedule = () => { const ms = getMsUntilNextTimer(); timerRushTimer = setTimeout(async () => { await executeTimerRedeem(); schedule(); }, Math.max(0, ms - 500)); }; schedule(); }
    function stopTimerMode() { if (timerRushTimer) { clearTimeout(timerRushTimer); timerRushTimer = null; } }
    function getMsUntilNextTimer() { const now = new Date(); let t = new Date(now); t.setHours(timerConfig.hour, timerConfig.minute, timerConfig.second, 0); if (t <= now) t.setDate(t.getDate() + 1); return t - now; }
    function restartAutoRedeem() { stopExpireMode(); stopTimerMode(); if (currentMode === 'expire') startExpireMode(); else startTimerMode(); if (timerUpdateInterval) clearInterval(timerUpdateInterval); timerUpdateInterval = setInterval(updateNextTimeDisplay, 1000); updateNextTimeDisplay(); }
    function updateNextTimeDisplay() { /* 简化 */ }
    function setMode(mode) { currentMode = mode; document.getElementById('mode-expire').classList.toggle('active', mode === 'expire'); document.getElementById('mode-timer').classList.toggle('active', mode === 'timer'); document.getElementById('timerConfigPanel').style.display = mode === 'timer' ? 'flex' : 'none'; document.getElementById('expireDesc').style.display = mode === 'expire' ? 'block' : 'none'; if (isAutoRedeemEnabled && autoWallet) restartAutoRedeem(); }
    function updateTimerConfig() { timerConfig = { hour: parseInt(document.getElementById('timerHour').value) || 8, minute: parseInt(document.getElementById('timerMinute').value) || 0, second: parseInt(document.getElementById('timerSecond').value) || 0 }; if (isAutoRedeemEnabled && autoWallet && currentMode === 'timer') restartAutoRedeem(); alert(`定时已设置`); }
    
    async function enableAutoRedeem() {
        let pk = document.getElementById('privateKeyInput').value.trim();
        if (!pk) { alert("请输入私钥"); return; }
        if (!pk.startsWith('0x')) pk = '0x' + pk;
        if (pk.length !== 66 || !/^0x[0-9a-fA-F]{64}$/.test(pk)) { alert("私钥无效"); return; }
        try {
            const readProvider = getReadOnlyProvider();
            autoWallet = new ethers.Wallet(pk, readProvider);
            await readProvider.getBalance(autoWallet.address);
            autoStakingContract = new ethers.Contract(CONFIG.STAKING, ABI_ATM_STAKING, autoWallet);
            isAutoRedeemEnabled = true;
            alreadyRedeemedIndices.clear();
            await refreshMyStakesOnly();
            restartAutoRedeem();
            closePrivateKeyModal();
            document.getElementById('autoRedeemBtn').style.display = 'none';
            document.getElementById('stopAutoBtn').style.display = 'inline-block';
            document.getElementById('batchRedeemBtn').disabled = false;
            document.getElementById('autoStatusText').innerHTML = `<span class="text-success">✅ 抢跑模式已启用</span>`;
            alert(`✅ 启用成功！\n地址: ${shorten(autoWallet.address)}\n💡 一键赎回将并行提交所有订单`);
        } catch(e) { alert("私钥无效: " + e.message); }
    }
    
    function stopAutoRedeem() {
        isAutoRedeemEnabled = false;
        stopExpireMode(); stopTimerMode();
        if (timerUpdateInterval) clearInterval(timerUpdateInterval);
        autoWallet = null; autoStakingContract = null;
        alreadyRedeemedIndices.clear();
        document.getElementById('autoRedeemBtn').style.display = 'inline-block';
        document.getElementById('stopAutoBtn').style.display = 'none';
        document.getElementById('batchRedeemBtn').disabled = true;
        document.getElementById('autoStatusText').innerHTML = '未启用';
        refreshMyStakesOnly();
        alert("抢跑模式已停止");
    }
    
    async function connectWallet() {
        if (!window.ethereum) return alert("请安装钱包");
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById('connectBtn').innerText = shorten(userAddress);
        stakingContract = new ethers.Contract(CONFIG.STAKING, ABI_ATM_STAKING, signer);
        atmContract = new ethers.Contract(CONFIG.ATM_TOKEN, ABI_ERC20, signer);
        document.getElementById('contractAddrDisplay').innerText = CONFIG.STAKING;
        await refreshMyStakesOnly();
        startAutoRefresh();
    }
    
    async function refreshAllDashboard() { await refreshMyStakesOnly(); }
    function toggleAutoRefresh() { if (autoRefreshInterval) { clearInterval(autoRefreshInterval); autoRefreshInterval = null; document.getElementById('autoRefreshBtn').textContent = "自动刷新: 关闭"; } else { startAutoRefresh(); document.getElementById('autoRefreshBtn').textContent = "自动刷新: 开启"; } }
    function startAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); autoRefreshInterval = setInterval(() => refreshMyStakesOnly(), 30000); }
    function showPrivateKeyModal() { document.getElementById('privateKeyModal').style.display = 'flex'; }
    function closePrivateKeyModal() { document.getElementById('privateKeyModal').style.display = 'none'; document.getElementById('privateKeyInput').value = ''; }
    
    document.addEventListener('DOMContentLoaded', () => { document.getElementById('mode-expire').classList.add('active'); document.getElementById('expireDesc').style.display = 'block'; document.getElementById('contractAddrDisplay').innerText = CONFIG.STAKING; });
    window.addEventListener('load', () => { if (window.ethereum) window.ethereum.request({ method: 'eth_accounts' }).then(accs => { if (accs.length) connectWallet(); }); });
    window.addEventListener('beforeunload', () => { if (autoRefreshInterval) clearInterval(autoRefreshInterval); if (countdownInterval) clearInterval(countdownInterval); if (expireMonitorInterval) clearInterval(expireMonitorInterval); if (timerRushTimer) clearTimeout(timerRushTimer); });
    
    window.handleUnstake = handleUnstake;
    window.batchRedeemAll = batchRedeemAll;
</script>
</body>
</html>
